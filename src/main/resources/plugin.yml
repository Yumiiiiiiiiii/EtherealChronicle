name: EtherealChronicle
version: '${version}'
main: net.nakaymi.etherealchronicle.paper.RpgPlugin
api-version: '26.3'
description: Original fantasy MMORPG for PaperMC
softdepend: [BetterModel]
commands:
  ec:
    description: Ethereal Chronicle admin command
    usage: /ec
permissions:
  etherealchronicle.admin:
    description: Ethereal Chronicle administrator permission
    default: op
  etherealchronicle.pack.bypass:
    description: Operations and QA permission to stay connected after declining the required resource pack
    default: op

website: https://nakaymi.net
authors: [nakaymi]
