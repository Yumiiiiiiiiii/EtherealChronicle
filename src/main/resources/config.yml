# auto follows each player's Minecraft client language. Supported values: auto, ja_jp, en_us.
language: auto
resource_pack:
  enabled: true
  required: false
  mode: game_port # experimental; requires same_port_netty.enabled: true
  external_url: ""
  external_sha1: ""
  embedded_http:
    # 公開サーバーではポート開放が不要なHTTPS対応 external_url を推奨します。
    bind_host: "0.0.0.0"
    public_host: ""
    port: 25580
    max_concurrent: 32
    max_per_ip: 4
    idle_read_timeout_ms: 500
    header_deadline_ms: 1500
  same_port_netty:
    # 実験的機能です。mode: game_port と enabled: true を両方指定した場合だけ有効です。
    enabled: false
    max_concurrent: 16
    max_per_ip: 2
    max_header_bytes: 4096
    header_deadline_ms: 2000
    idle_timeout_ms: 500
    bandwidth_kb_per_sec: 1024
