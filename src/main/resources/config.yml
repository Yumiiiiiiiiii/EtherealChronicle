# auto follows each player's Minecraft client language. Supported values: auto, ja_jp, en_us.
language: auto
world:
  # ワールド動作モード。dedicated_ec_world（専用ワールド ec_world）または overworld（既存オーバーワールド統合）を指定します。
  # 実機プレイで自然生成オーバーワールドへ拠点・ダンジョン入口を統合する場合は overworld へ変更してください。
  mode: dedicated_ec_world
  # mode: overworld 時に統合先とするワールド名です（既定: world）。
  overworld_name: "world"
  # mode: overworld 時の空中ダンジョンインスタンス領域（省略時は以下の既定値を使用）。
  # ワールドボーダーを狭く設定している場合はボーダー内へ調整してください（推奨 base_y >= 160）。
  # dungeon:
  #   base_x: 100000
  #   base_y: 220
  #   base_z: 100000
  #   spacing: 256
ui:
  theme:
    # icons_only はリソパのアイコンだけを使う安全な既定値。full の背景はクライアント差を確認後に選択します。
    # 値: full / icons_only / off
    mode: icons_only
bettermodel:
  # 任意依存です。trueにして entity_models にIDを設定した場合だけモデル連携します。
  enabled: false
  entity_models: {}
resource_pack:
  enabled: true
  # 配信先が有効な場合は必須です。配信不能なら締め出し防止のため起動時に一時解除します。
  required: true
  # 必須パックが読み込まれるまで待つ秒数です（有効範囲: 10..600）。
  required_timeout_seconds: 120
  # true にするとパック要求の判定・送信・完了・拒否・タイムアウトをログへ記録します。
  debug: false
  mode: game_port # experimental; requires same_port_netty.enabled: true; use external_managed when another plugin/server.properties sends the pack
  external_url: ""
  external_sha1: ""
  # external_managed では空なら全配信元のPackStatusを監視し、UUID指定時はそのIDだけを対象にします。
  expected_pack_id: ""
  embedded_http:
    # 公開サーバーではポート開放が不要なHTTPS対応 external_url を推奨します。
    bind_host: "0.0.0.0"
    public_host: ""
    port: 25580
    max_concurrent: 32
    max_per_ip: 4
    idle_read_timeout_ms: 500
    header_deadline_ms: 1500
    write_deadline_ms: 5000
  same_port_netty:
    # 実験的機能です。mode: game_port と enabled: true を両方指定した場合だけ有効です。
    enabled: false
    max_concurrent: 16
    max_per_ip: 2
    max_header_bytes: 4096
    header_deadline_ms: 2000
    idle_timeout_ms: 500
    bandwidth_kb_per_sec: 1024
