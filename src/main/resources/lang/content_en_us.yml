ec.content.dialogue.dlg_baldo_hermit.name: "Baldo the Forest Hermit's Hut"
ec.content.dialogue.dlg_baldo_hermit.root.text: "Hmm... a young one wandering all the way to the northeast corner of Ashwood Forest, is it? I am Baldo, the forest hermit. I jot down the memories of ancient trees and starshards."
ec.content.dialogue.dlg_baldo_hermit.root.choice.greet_baldo: "Do you really live this deep in the forest?"
ec.content.dialogue.dlg_baldo_hermit.root.choice.bye_first: "Sorry to bother you. I'll come back."
ec.content.dialogue.dlg_baldo_hermit.found_root.text: "Fate has smiled on us. I shall grant you the ancient-tree notes I hid deep in the forest. And if you gather the forest's bounty for me, I'll reward you with a prized whetstone, a feast, and the honor of Secret Record Discoverer."
ec.content.dialogue.dlg_baldo_hermit.found_root.choice.claim_baldo_cache: "Open the hidden chest at the base of the ancient tree (first time only)"
ec.content.dialogue.dlg_baldo_hermit.found_root.choice.start_h02: "[Hidden] Receive the Hermit's Ancient Tree Record (Lv5+)"
ec.content.dialogue.dlg_baldo_hermit.found_root.choice.complete_h02: "[Hidden] Deliver the forest's bounty to Baldo"
ec.content.dialogue.dlg_baldo_hermit.found_root.choice.grove_lore: "Ask about Ashwood gathering veins and the Amber Starwood"
ec.content.dialogue.dlg_baldo_hermit.found_root.choice.bye_found: "I'll stop by again when I walk the forest."
ec.content.dialogue.dlg_baldo_hermit.baldo_cache_done.text: "That is the \"Ancient Tree Record Fragment.\" Just holding it should carve a new page into your collection codex."
ec.content.dialogue.dlg_baldo_hermit.baldo_cache_done.choice.back_from_cache: "I'll keep it safe."
ec.content.dialogue.dlg_baldo_hermit.lore_node.text: "In the north and west of the Ashwood you'll find soft Morning Dew Moss, on the south shore the Amber Starwood, and in the eastern rock shade the Surface Starsteel Vein, which you can mine without entering the mine. Make your rounds and you'll never lack early-game whetstones."
ec.content.dialogue.dlg_baldo_hermit.lore_node.choice.back_from_lore: "Thanks for the great gathering route!"
ec.content.dialogue.dlg_baldo_hermit.h02_started.text: "Then I leave it to you. Walk every corner of Ashwood Forest and bring me 2 Morning Dew Moss and 2 Forest Amber Sap."
ec.content.dialogue.dlg_baldo_hermit.h02_done.text: "Splendid! The Ancient Tree Record is complete. As promised, here are 2 Artisan's Polishing Whetstones and Amber Carp Teriyaki. Your name shall be told as the \"Discoverer of the Ashwood Secret Record\"!"
ec.content.dialogue.dlg_borka_hub.name: "Borka's Forge"
ec.content.dialogue.dlg_borka_hub.root.text: "Gahaha! Good to see you, hero of the south! I'm Borka, the smith of this outpost. Even under this freezing sky, I never let the forge fire die. Gear, warm smoked salmon, everything you need is right here!"
ec.content.dialogue.dlg_borka_hub.root.choice.open_shop: "Browse Frostpeak gear and exchange"
ec.content.dialogue.dlg_borka_hub.root.choice.start_s01: "Hear about making cold-weather gear (Furs and Crystals to Withstand the Cold - Accept)"
ec.content.dialogue.dlg_borka_hub.root.choice.complete_s01: "I brought the furs and frost crystals (Furs and Crystals to Withstand the Cold - Report)"
ec.content.dialogue.dlg_borka_hub.root.choice.start_side_10: "Take the Masterwork Greaves forging commission (Frostpeak Smithing Masterwork Greaves - Accept)"
ec.content.dialogue.dlg_borka_hub.root.choice.complete_side_10: "I brought the whetstones and Azure Frost Shards (Frostpeak Smithing Masterwork Greaves - Report)"
ec.content.dialogue.dlg_borka_hub.root.choice.bye: "I'll come back to the hearth."
ec.content.dialogue.dlg_borka_hub.root_discount.text: "Gahaha! Thanks to you stabilizing the conduit at low temperature, the forge is running perfectly! As thanks, I'll always sell you gold-priced goods at 10% off. Look as much as you like!"
ec.content.dialogue.dlg_borka_hub.root_discount.choice.open_shop_disc: "Browse Frostpeak gear and exchange (10% gold discount applied)"
ec.content.dialogue.dlg_borka_hub.root_discount.choice.start_s01_disc: "Hear about making cold-weather gear (Furs and Crystals to Withstand the Cold - Accept)"
ec.content.dialogue.dlg_borka_hub.root_discount.choice.complete_s01_disc: "I brought the furs and frost crystals (Furs and Crystals to Withstand the Cold - Report)"
ec.content.dialogue.dlg_borka_hub.root_discount.choice.start_side_10_disc: "Take the Masterwork Greaves forging commission (Frostpeak Smithing Masterwork Greaves - Accept)"
ec.content.dialogue.dlg_borka_hub.root_discount.choice.complete_side_10_disc: "I brought the whetstones and Azure Frost Shards (Frostpeak Smithing Masterwork Greaves - Report)"
ec.content.dialogue.dlg_borka_hub.root_discount.choice.bye_disc: "Thanks, Borka!"
ec.content.dialogue.dlg_borka_hub.s01_started.text: "If you're heading deep into the frostpeaks, an ordinary helm will freeze your head solid! Bring me 6 Rime Wolf pelts and 3 frost crystal fragments! I'll hammer out my special Frostpeak Cold-Ward Helm for free!"
ec.content.dialogue.dlg_borka_hub.s01_done.text: "Well, if it isn't top-grade furs and crystals! Here, a freshly made Frostpeak Cold-Ward Helm and my pride, warm smoked salmon. You'll fight on in the blizzard just fine, gahaha!"
ec.content.dialogue.dlg_borka_hub.side_10_started.text: "I heard about the famed Artisan's Polishing Whetstone from Kaede at the port! Bring me 2 of those and 8 Azure Frost Shards, and Kaede and I will forge our joint design, the Masterforged Starsteel Greaves!"
ec.content.dialogue.dlg_borka_hub.side_10_done.text: "Gahaha! This is my masterpiece! Here, take the Masterforged Starsteel Greaves and a merit seal. You'll shrug off any mighty foe's stomp!"
ec.content.dialogue.dlg_celia_hub.name: "Celia's Guidance"
ec.content.dialogue.dlg_celia_hub.root.text: "Welcome to Lumina Port! Is there anything I can help you with?"
ec.content.dialogue.dlg_celia_hub.root.choice.start_tour: "I'd like a tour of Lumina Port's facilities (Accept quest)"
ec.content.dialogue.dlg_celia_hub.root.choice.complete_tour: "I finished greeting everyone (Report quest)"
ec.content.dialogue.dlg_celia_hub.root.choice.skill_help: "I'd like to hear how to use skills again"
ec.content.dialogue.dlg_celia_hub.root.choice.goodbye: "Maybe another time"
ec.content.dialogue.dlg_celia_hub.intro_welcome.text: "Welcome to Lumina Port! You must be tired from the long airship flight! You're the new adventurer everyone's been talking about, right? Let's start with your guild registration!"
ec.content.dialogue.dlg_celia_hub.intro_welcome.choice.register: "Yes, please register me as an adventurer"
ec.content.dialogue.dlg_celia_hub.intro_welcome.choice.ask_lore: "Tell me about Aeria and the Starshards"
ec.content.dialogue.dlg_celia_hub.lore_explain.text: "A thousand years ago, the Aether Core that held up the sky shattered, and its fragments, the Starshards, fell on the floating islands everywhere. They're a vital resource for our lives, but when they run wild they drive monsters mad. ...Lately there have been some ominous rumors from the forest, too."
ec.content.dialogue.dlg_celia_hub.lore_explain.choice.register_after_lore: "I see. Then please register me as an adventurer!"
ec.content.dialogue.dlg_celia_hub.intro_registered.text: "Registration complete! Here's your Lumina Apprentice Adventurer's Pass. Go greet Guildmaster Vulcan in the back and decide your fighting class!"
ec.content.dialogue.dlg_celia_hub.intro_progress.text: "Guildmaster Vulcan is in the back of headquarters. Once you've chosen your class, greet Garudo the blacksmith, then return to the guildmaster."
ec.content.dialogue.dlg_celia_hub.intro_progress.choice.register_existing_adventurer: "Receive the adventurer's pass"
ec.content.dialogue.dlg_celia_hub.intro_progress.choice.skill_help_intro: "Tell me how to use skills"
ec.content.dialogue.dlg_celia_hub.intro_progress.choice.close_intro: "Got it, I'm on my way"
ec.content.dialogue.dlg_celia_hub.tour_started.text: "Before heading out, let's greet the reliable shopkeepers of Lumina Port! Please make the rounds to Garudo the blacksmith, Mira the herbalist, and Pip the peddler on the pier."
ec.content.dialogue.dlg_celia_hub.tour_completed.text: "Good work! They're quirky, but they know their craft. Here, take this apprentice helm and a return scroll!"
ec.content.dialogue.dlg_celia_hub.tutorial_skill.text: "Hotbar slot 9 is the \"skill slot\"! Hold your weapon and press F (swap hands) to cycle skills 1-4, then right-click to cast. Sneak + right-click also switches. Check your HP and cooldowns on the ActionBar at the bottom of the screen!"
ec.content.dialogue.dlg_celia_hub.tutorial_skill.choice.ack_skill: "Thanks, I understand now"
ec.content.dialogue.dlg_celia_hub.post_ch1.text: "Hero who conquered the Void Sanctum! The whole town is talking about your deeds. ...It seems a new regular flight notice has come in from the north, toward the Azure Frostpeaks. I'm rooting for your next journey's preparations!"
ec.content.dialogue.dlg_celia_hub.post_ch1.choice.post_tour_start: "Take the Lumina Port facility tour"
ec.content.dialogue.dlg_celia_hub.post_ch1.choice.post_tour_done: "Report the Lumina Port greetings"
ec.content.dialogue.dlg_celia_hub.post_ch1.choice.post_skill: "Review how to use skills"
ec.content.dialogue.dlg_celia_hub.post_ch1.choice.post_bye: "Thanks, Celia"
ec.content.dialogue.dlg_daren_hub.name: "Daren's Confession"
ec.content.dialogue.dlg_daren_hub.root.text: "...H-hey, adventurer. Don't go poking too deep into the tunnels. That place is already beyond our control..."
ec.content.dialogue.dlg_daren_hub.root.choice.ask_mine: "What's happening in the Weeping Mine?"
ec.content.dialogue.dlg_daren_hub.root.choice.start_side_05: "Hear about the pickaxe left in the collapsed tunnel (The Pickaxe Left in the Collapsed Tunnel - Accept)"
ec.content.dialogue.dlg_daren_hub.root.choice.complete_side_05: "I've calmed the monsters in the collapsed tunnel (The Pickaxe Left in the Collapsed Tunnel - Report)"
ec.content.dialogue.dlg_daren_hub.root.choice.bye: "I'll be careful"
ec.content.dialogue.dlg_daren_hub.mine_info.text: "That tunnel's been sealed since the cave-in ten years ago, but a few days back purple mist and creepy people moved in... Sorry, that's all I can tell you."
ec.content.dialogue.dlg_daren_hub.choice2_confront.text: "...! That black-wax-sealed secret letter... you brought it out from deep in the tunnel? Yes, I admit it. I handed the Shaft 3 seal key to the Hollow Hand! But listen: the cult took two young miners, missing since the cave-in, as hostages...! I'm sorry, I was too weak..."
ec.content.dialogue.dlg_daren_hub.choice2_confront.choice.forgive_daren: "I understand. So that no one else is lost, fight with me and atone"
ec.content.dialogue.dlg_daren_hub.choice2_confront.choice.report_daren: "Hostages or not, betrayal is betrayal. I'll report you to the guild as the rules require"
ec.content.dialogue.dlg_daren_hub.daren_forgiven.text: "You mean it, adventurer?! Damn, you're making me tear up... All right, I'll atone with my life! First, the weakness I know: the Iron Grinder in Shaft 3 has a fragile cooling valve on its back! Slip behind it during the overheat laser's opening, it'll surely work! Report to Supply Officer Tomas and receive the key."
ec.content.dialogue.dlg_daren_hub.daren_reported.text: "...Yes. I shouldn't be let off easy. Fine, I won't run or hide. Hand me over to Supply Officer Tomas. ...Just one thing: please don't abandon the miners deeper in..."
ec.content.dialogue.dlg_daren_hub.forgiven_hub.text: "Because you believed in me, I feel like picking up a pickaxe again. Tell me anything I can do!"
ec.content.dialogue.dlg_daren_hub.forgiven_hub.choice.start_s08: "Ask about the hidden shaft (The Miner Chief's Atonement - Accept)"
ec.content.dialogue.dlg_daren_hub.forgiven_hub.choice.complete_s08: "I've calmed the monsters in the hidden shaft (The Miner Chief's Atonement - Report)"
ec.content.dialogue.dlg_daren_hub.forgiven_hub.choice.start_side_05_f: "Hear about the pickaxe left in the collapsed tunnel (The Pickaxe Left in the Collapsed Tunnel - Accept)"
ec.content.dialogue.dlg_daren_hub.forgiven_hub.choice.complete_side_05_f: "I've calmed the monsters in the collapsed tunnel (The Pickaxe Left in the Collapsed Tunnel - Report)"
ec.content.dialogue.dlg_daren_hub.forgiven_hub.choice.boss_hint: "Ask again about the Iron Grinder's weakness"
ec.content.dialogue.dlg_daren_hub.forgiven_hub.choice.bye_f: "I'll be back, Daren"
ec.content.dialogue.dlg_daren_hub.grinder_hint.text: "Lure its drill charge into a wall and it overheats, leaving an opening. And once it starts firing the overheat laser, get around to the back cooling valve! If the vent core runs wild, get as far away as you can!"
ec.content.dialogue.dlg_daren_hub.s08_started.text: "Deep in the hidden shaft lie the keepsakes of comrades I couldn't save. Will you help me end my sin by calming the Hollow Miners and cultists?"
ec.content.dialogue.dlg_daren_hub.s08_done.text: "...Thank you. Now they can finally rest. This Purified Starshard is a treasure I dug up in my youth. Take it with you, and go blast those cultists on Stargazer Hill!"
ec.content.dialogue.dlg_daren_hub.reported_hub.text: "...I'll accept the guild's judgment. You go on ahead, and stop the cult for my sake too."
ec.content.dialogue.dlg_daren_hub.reported_hub.choice.start_side_05_r: "Hear about the pickaxe left in the collapsed tunnel (The Pickaxe Left in the Collapsed Tunnel - Accept)"
ec.content.dialogue.dlg_daren_hub.reported_hub.choice.complete_side_05_r: "I've calmed the monsters in the collapsed tunnel (The Pickaxe Left in the Collapsed Tunnel - Report)"
ec.content.dialogue.dlg_daren_hub.reported_hub.choice.bye_r: "Understood"
ec.content.dialogue.dlg_daren_hub.side_05_started.text: "My partner, lost in the cave-in ten years ago, left his pickaxe behind in the collapsed tunnel. Could you calm 6 Void Coal Miners and 4 Kobolds so he can rest in peace?"
ec.content.dialogue.dlg_daren_hub.side_05_done.text: "...Thank you, adventurer. Now my partner should rest in peace. As thanks, please take a merit seal and an Artisan's Polishing Whetstone."
ec.content.dialogue.dlg_elena_hub.name: "Elena's Command"
ec.content.dialogue.dlg_elena_hub.root.text: "Let's skip the idle chatter. The forest situation is not good. State your business."
ec.content.dialogue.dlg_elena_hub.root.choice.complete_m02: "I drove the monsters off the road (Strange Changes in the Forest and First Battle - Report)"
ec.content.dialogue.dlg_elena_hub.root.choice.start_m03: "Go investigate the starshard deep in the forest (The Rampaging Starshard - Accept)"
ec.content.dialogue.dlg_elena_hub.root.choice.start_s05: "Hear about the scout patrol (Scouts in the Misty Woods - Accept)"
ec.content.dialogue.dlg_elena_hub.root.choice.complete_s05: "I retrieved the scout's observation records (Scouts in the Misty Woods - Report)"
ec.content.dialogue.dlg_elena_hub.root.choice.start_side_03: "Escort the wounded scout to the mine (Escort the Wounded Scout Home - Accept)"
ec.content.dialogue.dlg_elena_hub.root.choice.bye: "I'll report again later"
ec.content.dialogue.dlg_elena_hub.m02_done.text: "...Reinforcements from the guild, then. Better organized than I expected. But stay sharp. The monsters going mad is no coincidence; deep in the forest, a starshard is running wild."
ec.content.dialogue.dlg_elena_hub.m02_done.choice.accept_m03_now: "Go stop the starshard's rampage (The Rampaging Starshard - Accept)"
ec.content.dialogue.dlg_elena_hub.m02_done.choice.close_m02: "I'll prepare first"
ec.content.dialogue.dlg_elena_hub.m03_started.text: "The giant tree in Old Tree Plaza, the Starblighted Treant, swallowed a starshard and turned into a monster. It's weak to fire and void, and the roots erupting at its feet are dangerous. When you see a red warning, get away immediately. After you defeat it, bring back the rampaging starshard and we'll decide what to do with it."
ec.content.dialogue.dlg_elena_hub.choice1_shard.text: "...Around the rampaging starshard, \"black wedges\" had been driven in. Someone made it run wild on purpose. Now, about this starshard's fate, there are two paths: return it to the forest earth to purify it, or, as Lord Vulcan proposed, extract it into a magic vessel as guild strength. I'll hear your judgment as the one who stood there."
ec.content.dialogue.dlg_elena_hub.choice1_shard.choice.choose_purify: "Return it to the forest earth to purify it (protect nature's harmony - 10% discount at Mira's shop)"
ec.content.dialogue.dlg_elena_hub.choice1_shard.choice.choose_extract: "Seal and extract it into a magic vessel for the guild (power against the cult - 10% discount at Garudo's shop)"
ec.content.dialogue.dlg_elena_hub.choice1_shard.choice.decide_later: "Let me think a little more"
ec.content.dialogue.dlg_elena_hub.after_purify.text: "...Not a bad call. Look, the quiet of the ashwood leaves is returning. I'll tell Mira the herbalist that the forest's bounty has been protected. Report the matter of the black wedges to Lord Vulcan."
ec.content.dialogue.dlg_elena_hub.after_extract.text: "...Rational, but a bit risky. Well, I can understand the argument that we need power to fight the Hollow Hand. Garudo the smith and Lord Vulcan will be pleased. Report the black wedges to the guildmaster."
ec.content.dialogue.dlg_elena_hub.after_purify_hub.text: "Thanks to you returning the starshard to the forest, calm has returned to the trees. ...I'm grateful. What do you need?"
ec.content.dialogue.dlg_elena_hub.after_purify_hub.choice.start_s05_p: "Hear about the scout patrol (Scouts in the Misty Woods - Accept)"
ec.content.dialogue.dlg_elena_hub.after_purify_hub.choice.complete_s05_p: "I retrieved the scout's observation records (Scouts in the Misty Woods - Report)"
ec.content.dialogue.dlg_elena_hub.after_purify_hub.choice.start_side_03_p: "Escort the wounded scout to the mine (Escort the Wounded Scout Home - Accept)"
ec.content.dialogue.dlg_elena_hub.after_purify_hub.choice.bye_p: "I'll patrol and check for anything unusual"
ec.content.dialogue.dlg_elena_hub.after_extract_hub.text: "Make sure the extracted starshard's power is used to stop the Hollow Hand. ...I acknowledge your strength."
ec.content.dialogue.dlg_elena_hub.after_extract_hub.choice.start_s05_e: "Hear about the scout patrol (Scouts in the Misty Woods - Accept)"
ec.content.dialogue.dlg_elena_hub.after_extract_hub.choice.complete_s05_e: "I retrieved the scout's observation records (Scouts in the Misty Woods - Report)"
ec.content.dialogue.dlg_elena_hub.after_extract_hub.choice.start_side_03_e: "Escort the wounded scout to the mine (Escort the Wounded Scout Home - Accept)"
ec.content.dialogue.dlg_elena_hub.after_extract_hub.choice.bye_e: "Leave it to me"
ec.content.dialogue.dlg_elena_hub.s05_started.text: "The scout we sent to the forest watchtower has stopped sending scheduled reports. Patrol the marsh, eliminate the spore spiders, and retrieve the observation records left behind."
ec.content.dialogue.dlg_elena_hub.s05_done.text: "...So the scout had retreated safely. What a relief. I'll share the \"black-robed figure\" from the log with the guildmaster too. Take these light greaves; they'll help you run through the forest."
ec.content.dialogue.dlg_elena_hub.side_03_started.text: "I want to take a wounded scout to the supply post at the Weeping Mine, but Thorn Wolves and a Starblighted Treant are squatting on the road. Sweep them out to open a safe route and hand him over to Supply Officer Tomas."
ec.content.dialogue.dlg_freya_hub.name: "Freya's Expedition Orders"
ec.content.dialogue.dlg_freya_hub.root.text: "Welcome to the Northern Expedition's mooring pier. I am Expedition Captain Freya. An anomaly has been confirmed in the Azure Frostpeaks to the north. If you've come through the battles of Chapter 1, I'd like your strength."
ec.content.dialogue.dlg_freya_hub.root.choice.ch2_status: "Ask about the Azure Frostpeaks front"
ec.content.dialogue.dlg_freya_hub.root.choice.claim_vanguard_pack: "Receive the cold-resistance elixir for departure"
ec.content.dialogue.dlg_freya_hub.root.choice.bye: "I'll report again later"
ec.content.dialogue.dlg_freya_hub.departure_brief.text: "At last we meet, hero of Lumina. The pulse of the \"second Starshard\" that Kain spoke of in the Void Sanctum is surging in the far north, the Azure Frostpeaks. Please join the vanguard right now."
ec.content.dialogue.dlg_freya_hub.departure_brief.choice.start_m01_default: "Head for the Azure Frostpeaks (Voyage to the Azure Frostpeaks - Accept)"
ec.content.dialogue.dlg_freya_hub.departure_brief.choice.prep_before_north: "Gear up before sailing"
ec.content.dialogue.dlg_freya_hub.departure_guild.text: "Guildmaster Vulcan has told me about you, \"Shield of Lumina\". On the honor of the port you defended, I want to entrust you with the vanguard of the Northern Expedition. Observer Orphe and the smith Borka await at the frontier outpost!"
ec.content.dialogue.dlg_freya_hub.departure_guild.choice.start_m01_guild: "Understood, I'll sail as the vanguard (Voyage to the Azure Frostpeaks - Accept)"
ec.content.dialogue.dlg_freya_hub.departure_guild.choice.prep_guild: "I'll prepare a bit more before heading out"
ec.content.dialogue.dlg_freya_hub.departure_observatory.text: "Sage Lyra's starmap analysis was superb, \"Guide of Stars.\" At the coordinates it indicated, we've set up the Azure Frost Outpost. Observer Orphe, one of Lyra's disciples, is eagerly awaiting your arrival there."
ec.content.dialogue.dlg_freya_hub.departure_observatory.choice.start_m01_observatory: "Head for the starmap coordinates (Voyage to the Azure Frostpeaks - Accept)"
ec.content.dialogue.dlg_freya_hub.departure_observatory.choice.prep_observatory: "I'll prepare a bit more before heading out"
ec.content.dialogue.dlg_freya_hub.m01_started.text: "Preparations for sailing are complete! The Frostpeaks are bitterly cold, so take this cold-resistance elixir. When you reach the Azure Frost Outpost at the end of the eastern route, first greet the smith Borka and Observer Orphe. Good luck!"
ec.content.dialogue.dlg_freya_hub.m01_progress.text: "The airship is moored. Enter the Azure Frost Outpost and join the smith Borka and Observer Orphe. The blizzard is strengthening, so don't let your guard down."
ec.content.dialogue.dlg_freya_hub.m01_progress.choice.pack_in_progress: "Receive the cold-resistance elixir"
ec.content.dialogue.dlg_freya_hub.m01_progress.choice.bye_progress: "I'm heading there now"
ec.content.dialogue.dlg_freya_hub.pack_given.text: "This should keep out the worst of the cold. Don't push yourself too hard."
ec.content.dialogue.dlg_freya_hub.status_info.text: "The Azure Frostpeaks consist of four floating islands: the Outpost, Rime Ridge, the Azure Crystal Cavern, and the Azure Ice Citadel. The cult's Frostpeak Overseer Vesper ran the cooling mechanism wild, and the innermost Ice Citadel has become a fortress of extreme cold."
ec.content.dialogue.dlg_freya_hub.status_info.choice.status_back: "I see, I'll remember that"
ec.content.dialogue.dlg_freya_hub.ending_choice5.text: "Magnificent! You drove off Cryo Archon, Executor of the Ice Core, and brought back the Azure Ice Core Remnant! I hear Vesper left saying \"the third Starshard sleeps in the Crimson Crater\"... But first we must decide the fate of the purified second Starshard. Reseal it on-site as a gravity anchor to stabilize the Frostpeak islands, or, as Orphe proposes, entrust it as a resonance compass to the search for the third Starshard. The decision is yours."
ec.content.dialogue.dlg_freya_hub.ending_choice5.choice.choose_anchor: "Reseal it on-site as the Frostpeaks' gravity anchor (protect the Frostpeaks - bonus Ice Core Essence reward)"
ec.content.dialogue.dlg_freya_hub.ending_choice5.choice.choose_resonance: "Entrust it as a resonance compass to analyze the third Starshard (explore the Crimson Crater - 5 Azure Frost Shards for legendary exchange)"
ec.content.dialogue.dlg_freya_hub.ending_anchor.text: "A wise and unwavering decision. The Azure Ice Core will become a quiet gravity anchor once more, supporting the Frostpeak skies. Please accept the expedition's thanks and extra Ice Core Essence. Our next battlefield is the scorching Crimson Crater. Lead the Azure Fleet's vanguard again!"
ec.content.dialogue.dlg_freya_hub.ending_resonance.text: "A choice that opens the future. Orphe and Lady Lyra resonated the starshard and have already begun to catch faint coordinates of the Crimson Crater to the south. I've also arranged preferential legendary gear at smith Borka's exchange. Keep honing your skills for the next journey!"
ec.content.dialogue.dlg_freya_hub.post_ch2.text: "The Azure Frostpeaks have escaped the crisis of absolute zero thanks to you. But deep in the Ice Citadel, the echoes of the ice core are still recondensing. Until preparations for the Crimson Crater expedition are ready, can you help suppress the echoes?"
ec.content.dialogue.dlg_freya_hub.post_ch2.choice.start_s04: "Accept the repeatable quest \"Quelling the Citadel Echoes\""
ec.content.dialogue.dlg_freya_hub.post_ch2.choice.complete_s04: "Report the repeatable quest \"Quelling the Citadel Echoes\""
ec.content.dialogue.dlg_freya_hub.post_ch2.choice.post_lore: "Ask about the third Starshard, the Crimson Crater"
ec.content.dialogue.dlg_freya_hub.post_ch2.choice.bye_post: "I'll report again later"
ec.content.dialogue.dlg_freya_hub.s04_started.text: "That's reassuring. Head to the Azure Ice Citadel and suppress the reorganized royal guard and the echoes of Cryo Archon. Taking allies along is a wise move."
ec.content.dialogue.dlg_freya_hub.s04_done.text: "Splendid results. The Azure Frost Shards and Ice Core Essence you recovered are yours. Use them to strengthen legendary gear at Borka's forge!"
ec.content.dialogue.dlg_freya_hub.ch3_tease.text: "From Vesper's cipher and the starmap observations, we've determined that the \"third Starshard\" sleeps on the scorching floating island of the south, the Crimson Crater. After ice, fire — even fiercer battles must await. Let's gather supreme gear while we can."
ec.content.dialogue.dlg_freya_hub.ch3_tease.choice.back_from_tease: "I'll get ready"
ec.content.dialogue.dlg_freya_hub.global.choice.airship_to_frostpeak: "Take the airship to the Azure Frost Outpost"
ec.content.dialogue.dlg_garudo_hub.name: "Garudo's Forge"
ec.content.dialogue.dlg_garudo_hub.root.text: "Hmph, don't go to the battlefield swinging a dull blade. If you want gear that suits you, take a look."
ec.content.dialogue.dlg_garudo_hub.root.choice.open_shop: "Browse weapons and armor"
ec.content.dialogue.dlg_garudo_hub.root.choice.start_s06: "Hear about forging materials from the mine (The Stubborn Smith's Pride - Accept)"
ec.content.dialogue.dlg_garudo_hub.root.choice.complete_s06: "I brought old iron scraps and charged crystals (The Stubborn Smith's Pride - Report)"
ec.content.dialogue.dlg_garudo_hub.root.choice.start_side_04: "Help prototype the supreme whetstone (The Smith's Supreme Whetstone Prototype - Accept)"
ec.content.dialogue.dlg_garudo_hub.root.choice.complete_side_04: "I gathered scrap iron and thunder crystals (The Smith's Supreme Whetstone Prototype - Report)"
ec.content.dialogue.dlg_garudo_hub.root.choice.bye: "I'll come again"
ec.content.dialogue.dlg_garudo_hub.extract_discount.text: "Hey, kid! I hear you brought the forest starshard back to the guild. Thanks to that, my forge is running great. I'll sell you everything at 10% off, special treatment!"
ec.content.dialogue.dlg_garudo_hub.extract_discount.choice.open_shop_disc: "Browse weapons and armor at the discounted price"
ec.content.dialogue.dlg_garudo_hub.extract_discount.choice.start_s06_disc: "Hear about forging materials from the mine (The Stubborn Smith's Pride - Accept)"
ec.content.dialogue.dlg_garudo_hub.extract_discount.choice.complete_s06_disc: "I brought old iron scraps and charged crystals (The Stubborn Smith's Pride - Report)"
ec.content.dialogue.dlg_garudo_hub.extract_discount.choice.start_side_04_disc: "Help prototype the supreme whetstone (The Smith's Supreme Whetstone Prototype - Accept)"
ec.content.dialogue.dlg_garudo_hub.extract_discount.choice.complete_side_04_disc: "I gathered scrap iron and thunder crystals (The Smith's Supreme Whetstone Prototype - Report)"
ec.content.dialogue.dlg_garudo_hub.extract_discount.choice.bye_disc: "I'll come again"
ec.content.dialogue.dlg_garudo_hub.s06_started.text: "Hey, kid, I hear you're heading into the Weeping Mine. The old iron scraps and charged crystals there are top-grade smithing materials. Bring me 8 old iron scraps and 4 crystals. I'll forge you something extraordinary!"
ec.content.dialogue.dlg_garudo_hub.s06_done.text: "Hmph, you've got more talent than I thought. Good, now my forge can go all out. From now on I'll stock rare mine-grade gear on the shelves, so earn well and come buy!"
ec.content.dialogue.dlg_garudo_hub.side_04_started.text: "I'm prototyping something called the \"Artisan's Polishing Whetstone\" together with Kaede. Bring 4 scrap iron from the mine and 3 thunder crystals. When it's done, I'll share a prototype with you!"
ec.content.dialogue.dlg_garudo_hub.side_04_done.text: "Now that's prime stuff! Here, a freshly baked Artisan's Polishing Whetstone and a polishing elixir. Take them to Kaede's workshop and you can forge supreme gear with them!"
ec.content.dialogue.dlg_hana_hub.name: "Hana the Gathering Guide's Plaza"
ec.content.dialogue.dlg_hana_hub.root.text: "Hello! This is the Azure Gathering Guild information desk. Forest herbs, ancient starwood timber, starsteel veins in the mine, and stargazer crystals: with the proper gathering tool, you can safely harvest precious materials from resource nodes everywhere."
ec.content.dialogue.dlg_hana_hub.root.choice.open_gatherer_shop: "Open the Starshard Gathering Exchange (gathering tools, elixir brewing, whetstone refining)"
ec.content.dialogue.dlg_hana_hub.root.choice.start_g01: "[Gathering] Accept \"Harvesting the Starshard Earth\" (beginner, pickaxe and silver sickle provided)"
ec.content.dialogue.dlg_hana_hub.root.choice.complete_g01: "[Gathering] Complete \"Harvesting the Starshard Earth\""
ec.content.dialogue.dlg_hana_hub.root.choice.start_g02: "[Gathering] Accept \"Mine Starsteel Vein Survey\" (Lv6+, crystal extractor provided)"
ec.content.dialogue.dlg_hana_hub.root.choice.complete_g02: "[Gathering] Report \"Mine Starsteel Vein Survey\""
ec.content.dialogue.dlg_hana_hub.root.choice.start_g03: "[Gathering] Accept \"Stargazer and Rime Treasure Gathering\" (Lv14+, unlocks a title)"
ec.content.dialogue.dlg_hana_hub.root.choice.complete_g03: "[Gathering] Report \"Stargazer and Rime Treasure Gathering\""
ec.content.dialogue.dlg_hana_hub.root.choice.start_d02: "[Daily] Accept Hana's Material Procurement Request (refreshes daily, Lv3+)"
ec.content.dialogue.dlg_hana_hub.root.choice.complete_d02: "[Daily] Report the Material Procurement Request"
ec.content.dialogue.dlg_hana_hub.root.choice.gathering_tips: "Ask about node rules and party bonuses"
ec.content.dialogue.dlg_hana_hub.root.choice.bye: "I'll go gather more materials"
ec.content.dialogue.dlg_hana_hub.g01_started.text: "First, inspect the vegetation of Ashwood Forest and return to me. I'll give you the basic Starsteel Mining Pickaxe and the Herbalist's Silver Sickle!"
ec.content.dialogue.dlg_hana_hub.g01_done.text: "Good work! Please take the pickaxe, the silver sickle, and a sample Ash Leaf. Higher-grade gathering tools and whetstone refining are also available at the exchange."
ec.content.dialogue.dlg_hana_hub.g02_started.text: "A fine starsteel vein has been found in the Weeping Mine. Could you survey the mine and bring back 3 starsteel ore? As thanks, I'll provide a Starshard Crystal Extractor!"
ec.content.dialogue.dlg_hana_hub.g02_done.text: "What wonderful purity in this starsteel ore! Here's the promised Starshard Crystal Extractor, a raw azure gem, and raw starwood logs. Now you can take on the crystal nodes on Stargazer Hill, too!"
ec.content.dialogue.dlg_hana_hub.g03_started.text: "High-purity starshard crystals and rare herbs sleep on Stargazer Hill and Rime Ridge. Survey both areas and deliver 2 Azure Crystal Cores!"
ec.content.dialogue.dlg_hana_hub.g03_done.text: "Masterful gathering skill! I present you the emblem of the title \"Azure Gathering Artisan,\" plus Frostflower herbs, Moondew spirit herbs, and a special Moondew and Resin Elixir!"
ec.content.dialogue.dlg_hana_hub.d02_started.text: "Today's material request. Check on the safety of the Weeping Mine and deliver 2 bundles of Ash Leaf. As thanks, I've prepared Starwood Resin and an Artisan's Polishing Whetstone!"
ec.content.dialogue.dlg_hana_hub.d02_done.text: "Thank you! What nicely scented Ash Leaf. Here are your rewards, Starwood Resin and an Artisan's Polishing Whetstone. Please help again tomorrow!"
ec.content.dialogue.dlg_hana_hub.tips_node.text: "Gathering nodes aren't broken like blocks; you right-click them while holding the matching gathering tool. Respawn timers are per player, so no worries about someone stealing yours, and rare gathering rates go up when party members are nearby!"
ec.content.dialogue.dlg_hana_hub.tips_node.choice.tips_back: "Thanks, that was easy to follow"
ec.content.dialogue.dlg_kaede_hub.name: "Kaede the Artisan's Workshop"
ec.content.dialogue.dlg_kaede_hub.root.text: "Welcome! This is the forging and brewing workshop. Bring Azure Salmon or Stardew Lotus and I'll turn them into superb dishes and elixirs, and with polishing whetstones and trial medals I'll forge legendary gear for you too!"
ec.content.dialogue.dlg_kaede_hub.root.choice.open_artisan_shop: "Open the forging and brewing workshop (material crafting / gear forging)"
ec.content.dialogue.dlg_kaede_hub.root.choice.claim_artisan_kit: "Receive the workshop sample whetstone (first time only)"
ec.content.dialogue.dlg_kaede_hub.root.choice.start_g01: "[Gathering] Accept \"Azure Salmon Fishing Haul\" (12-hour repeat, Lv4+)"
ec.content.dialogue.dlg_kaede_hub.root.choice.complete_g01: "[Gathering] Report the fishing haul help"
ec.content.dialogue.dlg_kaede_hub.root.choice.start_g02: "[Gathering] Accept \"Stardew Lotus and Spirit Tree Gathering\" (12-hour repeat, Lv12+)"
ec.content.dialogue.dlg_kaede_hub.root.choice.complete_g02: "[Gathering] Report the Stardew Lotus gathering"
ec.content.dialogue.dlg_kaede_hub.root.choice.bye: "I'll go gather more materials"
ec.content.dialogue.dlg_kaede_hub.artisan_kit_done.text: "First, take this one \"Artisan's Polishing Whetstone.\" With scrap iron and thunder crystals you can make as many as you like at the workshop, so come back once you've gathered materials!"
ec.content.dialogue.dlg_kaede_hub.g01_started.text: "Aether Slimes have been spawning by the harbor river and ruining the salmon fishing. If you clear 6 slimes and bring 4 mana gels, I'll share fresh Azure Salmon and a special grilled fish!"
ec.content.dialogue.dlg_kaede_hub.g01_done.text: "Wonderful! A huge catch thanks to you. Here, 3 Azure Salmon and fresh herb-grilled fish! The salmon can be cooked into even better dishes at the workshop."
ec.content.dialogue.dlg_kaede_hub.g02_started.text: "I want to go pick Stardew Lotus on Stargazer Hill, but the Star Wisps are restless. If you calm 5 wisps and collect 3 star bark, I'll give you freshly picked Stardew Lotus and a whetstone as thanks!"
ec.content.dialogue.dlg_kaede_hub.g02_done.text: "Thanks! Here are the Stardew Lotus and the whetstone. Try brewing them into the \"Supreme Stardew Elixir\" or the \"Sturdy Blade Guard Polishing Elixir\" at the workshop!"
ec.content.dialogue.dlg_kain_encounters.name: "Confrontation with Kain"
ec.content.dialogue.dlg_kain_encounters.root.text: "Oh, forgive my late greeting. I am Kain, scribe of the Hollow Hand. I'm honored that you've chased me all the way from Lumina Port."
ec.content.dialogue.dlg_kain_encounters.root.choice.confront_kain: "I'll stop your plot to abuse the Starshards right here!"
ec.content.dialogue.dlg_kain_encounters.hill_reported.text: "Oh, the rising star of Lumina. I heard, you coldly cut down the miner chief who showed weakness? What admirable discipline. Why not join our side instead?"
ec.content.dialogue.dlg_kain_encounters.hill_reported.choice.reject_kain_r: "Who would follow the Hollow Hand!"
ec.content.dialogue.dlg_kain_encounters.hill_forgiven.text: "Oh, the rising star of Lumina. Forgiving even a traitor? How terribly soft. I only hope that depth of compassion doesn't prove your undoing in the sanctum's darkness."
ec.content.dialogue.dlg_kain_encounters.hill_forgiven.choice.reject_kain_f: "Don't underestimate the strength of trusting your comrades!"
ec.content.dialogue.dlg_kain_encounters.hill_exit.text: "Sadly, the sanctum's doors will open soon. Play with my subordinates for a while. I'll be waiting at the very back."
ec.content.dialogue.dlg_kain_encounters.sanctum_epilogue.text: "...Wonderful. A truly beautiful battle, rising star of Lumina. But don't misunderstand. This sanctum's core is merely the \"first key.\" My master has already reached for the \"second Starshard,\" the frozen core sleeping at the far north Azure Frostpeaks. By the time we meet again, the skies of Aeria will already have begun to fall... Until then, in the northern sky."
ec.content.dialogue.dlg_kain_encounters.sanctum_epilogue.choice.swear_pursuit: "Wait, Kain! I will protect the second Starshard too, no matter what!"
ec.content.dialogue.dlg_leila_board.name: "Leila the Quest Board Clerk's Counter"
ec.content.dialogue.dlg_leila_board.root.text: "Welcome to Lumina Port's \"Apprentice Quest Board\"! I handle daily and weekly hunts, gathering deliveries, collection codex quests, and even guidance on your first gear enhancement (+1 to +3)."
ec.content.dialogue.dlg_leila_board.root.choice.open_rookie_shop: "Open the apprentice exchange, cooking, and whetstone refining"
ec.content.dialogue.dlg_leila_board.root.choice.claim_rookie_pack: "Receive the quest board first-registration gift (first time only)"
ec.content.dialogue.dlg_leila_board.root.choice.menu_bounties: "View daily, weekly, and repeatable quests"
ec.content.dialogue.dlg_leila_board.root.choice.menu_collection: "View collection codex and gear enhancement (+1 to +3) basics"
ec.content.dialogue.dlg_leila_board.root.choice.enhance_guide: "Ask how to enhance gear (/ec enhance)"
ec.content.dialogue.dlg_leila_board.root.choice.bye: "I'll come see the quests again"
ec.content.dialogue.dlg_leila_board.registered_done.text: "Thanks for registering! For your long journey, here are 2 Herb-Fried Harbor Goby. Collect Azure Apprentice Badges and Rough Whetstone Fragments from the dailies, and you can enhance your gear from +1 to +3 early on!"
ec.content.dialogue.dlg_leila_board.registered_done.choice.back_from_reg: "Back to the quest board menu"
ec.content.dialogue.dlg_leila_board.bounty_menu.text: "Here are the current board quests. Dailies refresh every day and weeklies every Monday. Repeatable quests can be taken every 4 hours, perfect for earning!"
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.start_d01: "[Early Daily] Accept \"Slime Clearing Outside the Port\" (Lv1+)"
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.complete_d01: "[Early Daily] Report \"Slime Clearing Outside the Port\""
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.start_d02: "[Early Daily] Accept \"Ashwood Beast and Goblin Extermination\" (Lv3+)"
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.complete_d02: "[Early Daily] Report \"Ashwood Beast and Goblin Extermination\""
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.start_d03: "[Early Daily] Accept \"Harbor Town Morning Dew and Starsteel Delivery\" (Lv2+)"
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.complete_d03: "[Early Daily] Report \"Harbor Town Morning Dew and Starsteel Delivery\""
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.start_w01: "[Early Weekly] Accept \"Great Ashwood Cleanup Operation\" (Lv5+)"
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.complete_w01: "[Early Weekly] Report \"Great Ashwood Cleanup Operation\""
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.start_r01: "[Repeatable] Accept \"Ashwood Starsteel Pebble and Spore Collection\" (Lv4+, 4-hour repeat)"
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.complete_r01: "[Repeatable] Report \"Ashwood Starsteel Pebble and Spore Collection\""
ec.content.dialogue.dlg_leila_board.bounty_menu.choice.back_from_bounty: "Back to the first menu"
ec.content.dialogue.dlg_leila_board.collection_menu.text: "These are collection codex quests for gathering the fish and gathering materials of the port and Ashwood, plus beginner enhancement quests to support your first gear upgrades (+1 to +3). Collect 15 and 35 kinds of items to automatically unlock collection titles too!"
ec.content.dialogue.dlg_leila_board.collection_menu.choice.start_c01: "[Collection] Accept \"Lumina Port Bounty Codex\" (Lv2+)"
ec.content.dialogue.dlg_leila_board.collection_menu.choice.complete_c01: "[Collection] Report \"Lumina Port Bounty Codex\""
ec.content.dialogue.dlg_leila_board.collection_menu.choice.start_c02: "[Collection] Accept \"Ashwood Rare Fish and Amber Codex\" (Lv5+)"
ec.content.dialogue.dlg_leila_board.collection_menu.choice.complete_c02: "[Collection] Report \"Ashwood Rare Fish and Amber Codex\""
ec.content.dialogue.dlg_leila_board.collection_menu.choice.start_e01: "[Enhancement Basics] Accept \"Rough Whetstones and First Gear Forging\" (Lv3+)"
ec.content.dialogue.dlg_leila_board.collection_menu.choice.complete_e01: "[Enhancement Basics] Report \"Rough Whetstones and First Gear Forging\""
ec.content.dialogue.dlg_leila_board.collection_menu.choice.back_from_collection: "Back to the first menu"
ec.content.dialogue.dlg_leila_board.enhance_tips.text: "To enhance gear, just hold an \"Artisan's Polishing Whetstone\" and a bit of gold and open /ec enhance! +1 gives +3% to all stats, and +3 makes you 9% stronger. Collect \"Rough Whetstone Fragments\" from starsteel pebbles on the port's west end or Ashwood's surface veins, and you can refine them into polishing whetstones at my exchange. Give it a try!"
ec.content.dialogue.dlg_leila_board.enhance_tips.choice.back_from_tips: "Got it, I'll try it"
ec.content.dialogue.dlg_leila_board.d01_started.text: "Clearing 5 Aether Slimes, got it! Defeat 10 and progress toward the title \"Harbor Town Rising Hunter\" unlocks too! Be careful out there!"
ec.content.dialogue.dlg_leila_board.d01_done.text: "Good work! Take your Azure Apprentice Badge and Rough Whetstone Fragment. I'm counting on you again tomorrow!"
ec.content.dialogue.dlg_leila_board.d02_started.text: "Please exterminate 4 Thorn Wolves and 4 Moss Goblins in Ashwood Forest! Enhancing your gear to +1 will make it much easier."
ec.content.dialogue.dlg_leila_board.d02_done.text: "Wonderful skill! Here are your badge and Rough Whetstone Fragment. I recommend turning them into a Star Charm or polishing whetstone at the exchange!"
ec.content.dialogue.dlg_leila_board.d03_started.text: "Delivering 2 Morning Dew Moss and 2 riverbed starsteel pebbles, right? You can gather them right away at the port's west end and near the Ashwood entrance!"
ec.content.dialogue.dlg_leila_board.d03_done.text: "Thanks! As a bonus I'll add a \"Morning Dew Worm.\" Try it when you go after the twilight rare fish in Ashwood's clear stream!"
ec.content.dialogue.dlg_leila_board.w01_started.text: "This week's Great Ashwood Cleanup Operation! Conquer 8 Thorn Wolves, 6 Spore Spiders, and 1 Starblighted Treant in the depths, then report in!"
ec.content.dialogue.dlg_leila_board.w01_done.text: "Amazing! You even took down the Starblighted Treant! Take your 6 apprentice badges and 2 Artisan's Polishing Whetstones!"
ec.content.dialogue.dlg_leila_board.r01_started.text: "Defeat 3 Spore Spiders and collect 2 riverbed starsteel pebbles! You can take it every 4 hours, so do it while you gather materials."
ec.content.dialogue.dlg_leila_board.r01_done.text: "Welcome back! Starsteel pebbles and spore cleanup, perfect. See you again in 4 hours!"
ec.content.dialogue.dlg_leila_board.c01_started.text: "The Lumina Port Bounty Codex! Collect and show me 2 Harbor Goby from the pier, 2 starsteel pebbles from the west shore, and 2 Morning Dew Moss from the forest."
ec.content.dialogue.dlg_leila_board.c01_done.text: "A magnificent harbor codex! To celebrate, here are Herb-Fried Harbor Goby and an apprentice badge. Next, try the Ashwood Rare Fish Codex!"
ec.content.dialogue.dlg_leila_board.c02_started.text: "The Ashwood Rare Fish and Amber Codex! Bring 2 Moss Loach, 1 Dawnglow Dace that appears at dawn and dusk twilight, and 2 Forest Amber Sap!"
ec.content.dialogue.dlg_leila_board.c02_done.text: "You even caught the Dawnglow Dace at twilight! Take an Artisan's Polishing Whetstone and an apprentice badge as thanks. Luna at the northwest end of the port will be happy too!"
ec.content.dialogue.dlg_leila_board.e01_started.text: "Enhancement basics! First collect 3 Rough Whetstone Fragments and 2 Riverbed Starsteel Pebbles from the port's west shore, Ashwood's surface veins, or dailies, and bring them to me. I'll finish a polishing whetstone for you!"
ec.content.dialogue.dlg_leila_board.e01_done.text: "Perfect! Here are 2 Artisan's Polishing Whetstones. Go enhance a weapon or your Apprentice Adventurer's Star Charm to +1 through +2 with /ec enhance! Raise it to +3 and you can go toe to toe with Alpha, the Beastking of the arena!"
ec.content.dialogue.dlg_luna_hidden.name: "Luna the Starlight Keeper's Secret Talk"
ec.content.dialogue.dlg_luna_hidden.root.text: "...Oh, a rare adventurer to wander all the way to the port's northwest corner. I am Luna, keeper of the starlight. I watch over secret fish that appear only at certain times and in certain weather."
ec.content.dialogue.dlg_luna_hidden.root.choice.greet_luna: "What are you watching over, hiding in a place like this?"
ec.content.dialogue.dlg_luna_hidden.root.choice.bye_first: "Sorry to disturb you"
ec.content.dialogue.dlg_luna_hidden.found_root.text: "Since you've gone to the trouble of finding me, I'll share a special secret and the bait I hid. The waterside changes its face with the time of day and the sky."
ec.content.dialogue.dlg_luna_hidden.found_root.choice.claim_luna_cache: "Open the Starlight hidden small chest (first time only)"
ec.content.dialogue.dlg_luna_hidden.found_root.choice.start_h01: "[Hidden] Accept \"The Starlight Keeper and the Twilight Fish\" (Lv3+)"
ec.content.dialogue.dlg_luna_hidden.found_root.choice.complete_h01: "[Hidden] Show Luna the twilight and rainy night fish"
ec.content.dialogue.dlg_luna_hidden.found_root.choice.fish_secrets: "Hear hints about time- and weather-limited rare fish"
ec.content.dialogue.dlg_luna_hidden.found_root.choice.bye_found: "I'll come feel the night breeze again"
ec.content.dialogue.dlg_luna_hidden.luna_cache_done.text: "Heh, well found. Here are 3 \"Morning Dew Worms\" from the hidden chest. Try them in Ashwood's clear stream or at the port's pier."
ec.content.dialogue.dlg_luna_hidden.luna_cache_done.choice.back_from_cache: "Thank you, I'll treasure them"
ec.content.dialogue.dlg_luna_hidden.secret_hints.text: "Remember this. The \"Dawnglow Dace\" appears at the port and in Ashwood only at dawn and dusk twilight. The \"Rainy Night Eel\" emerges in Ashwood or mine waterways only on rainy or stormy nights. And once your Fishing reaches Lv7, try going for the legendary \"Amber Nishikigoi\" in Ashwood at twilight or night!"
ec.content.dialogue.dlg_luna_hidden.secret_hints.choice.back_from_hints: "What great info, I'll make a note"
ec.content.dialogue.dlg_luna_hidden.h01_started.text: "You'll take my secret request! If you catch 1 twilight \"Dawnglow Dace\" and 1 rainy-night \"Rainy Night Eel\" and show me, I'll hand over my treasured \"Willow Precision Beginner Rod.\""
ec.content.dialogue.dlg_luna_hidden.h01_done.text: "My, you really brought both... Splendid! Take the promised \"Willow Precision Beginner Rod\" and \"Morning Dew Worm.\" They say deep in Ashwood's northeast, the hermit Baldo lives quietly just like me."
ec.content.dialogue.dlg_lyra_hub.name: "Lyra the Stargazer Sage"
ec.content.dialogue.dlg_lyra_hub.root.text: "The stars' courses are badly disturbed... So you are the rising star of Lumina who drove off the mine giant. I am Lyra, the stargazer sage."
ec.content.dialogue.dlg_lyra_hub.root.choice.start_m07: "I came to stop the Hollow Hand cult (The Sage of Stargazer Hill - Accept)"
ec.content.dialogue.dlg_lyra_hub.root.choice.complete_m07: "I recovered the ancient astrolabe (The Sage of Stargazer Hill - Report)"
ec.content.dialogue.dlg_lyra_hub.root.choice.start_s10: "Ask about the ancient star monoliths (Touring the Ancient Star Monoliths - Accept)"
ec.content.dialogue.dlg_lyra_hub.root.choice.complete_s10: "I copied the monolith inscriptions (Touring the Ancient Star Monoliths - Report)"
ec.content.dialogue.dlg_lyra_hub.root.choice.complete_side_06: "Report the supply wagon escort from Supply Officer Tomas (Supply Wagon Escort Route to the Hill - Report)"
ec.content.dialogue.dlg_lyra_hub.root.choice.start_side_07: "Take the starshard impact site mana survey (Starshard Impact Site Mana Survey - Accept)"
ec.content.dialogue.dlg_lyra_hub.root.choice.complete_side_07: "Hand over the impact site mana data (Starshard Impact Site Mana Survey - Report)"
ec.content.dialogue.dlg_lyra_hub.root.choice.open_shop: "Open the Purified Starshard and supplies exchange"
ec.content.dialogue.dlg_lyra_hub.root.choice.bye: "I'll come again, Sage"
ec.content.dialogue.dlg_lyra_hub.m07_started.text: "The man in black, Kain, is trying to pry open the gate of the Void Sanctum sealed a thousand years ago. Recover the stolen ancient astrolabe and drive off the fanatics and stalkers."
ec.content.dialogue.dlg_lyra_hub.m07_done.text: "Well done! The astrolabe holds starlight once more. Now the sanctum's door is open. Inside, the ancient guardian awaits, stained by the void. Join forces with trusted allies to face it."
ec.content.dialogue.dlg_lyra_hub.m07_done.choice.accept_m08_now: "Challenge the Void Sanctum (The Void Core Guardian - Accept)"
ec.content.dialogue.dlg_lyra_hub.m07_done.choice.prep_sanctum: "Gear up before taking it on"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.text: "The astrolabe connects the gate to the sanctum. You can enter alone, but it was meant as a cooperative trial where allies guard each other's backs. Are you prepared?"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.start_m08: "Take the Void Warden subjugation (The Void Core Guardian - Accept)"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.enter_sanctum: "Enter the cooperative dungeon \"Void Sanctum\""
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.open_shop_ready: "View the Purified Starshard and Essence exchange"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.start_s10_ready: "Accept \"Touring the Ancient Star Monoliths\""
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.complete_s10_ready: "Report \"Touring the Ancient Star Monoliths\""
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.complete_side_06_ready: "Report the supply wagon escort (Supply Wagon Escort Route to the Hill - Report)"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.start_side_07_ready: "Accept the starshard impact site mana survey"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.complete_side_07_ready: "Report the starshard impact site mana survey"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.sanctum_tips: "Hear advice for beating the Void Warden"
ec.content.dialogue.dlg_lyra_hub.sanctum_ready.choice.bye_ready: "I'll come once I'm prepared"
ec.content.dialogue.dlg_lyra_hub.m08_started.text: "Kain has awakened the Void Core Guardian, the Void Warden, in the sanctum's depths. At this rate the floating island, Lumina Port and all, will be swallowed by the void. Please, free that pitiful guardian."
ec.content.dialogue.dlg_lyra_hub.tips_node.text: "The Void Warden has three phases. Avoid the gravity wave ring by jumping or leaving it, and lure the piercing void beam away from allies. In the final \"Resonant Sanctuary,\" gather with allies, and during \"Cataclysm Starstorm,\" run into the blue pillars of light."
ec.content.dialogue.dlg_lyra_hub.tips_node.choice.tips_back: "I'll keep it in mind"
ec.content.dialogue.dlg_lyra_hub.s10_started.text: "A thousand years ago, sages who witnessed the Aether Core's collapse carved star monoliths on this hill. Before the cult shatters them, could you calm the wisps and copy the inscriptions?"
ec.content.dialogue.dlg_lyra_hub.s10_done.text: "...So that is how it was. The core did not shatter naturally; it was torn apart by \"the one who summons the void.\" Thanks to you, light shines on a thousand-year-old mystery."
ec.content.dialogue.dlg_lyra_hub.side_06_done.text: "The supply wagon arrived safely! The observatory's stores are secure now. Please take this merit seal and some stargazer tea as thanks."
ec.content.dialogue.dlg_lyra_hub.side_07_started.text: "I want to observe the mana waveform of the starshard that fell on the sanctum's outskirts. Calm 6 Star Wisps and 4 Astral Stalkers, and record the mana at the sanctum's edge."
ec.content.dialogue.dlg_lyra_hub.side_07_done.text: "Hm, an intriguing waveform... The starshard's fluctuations seem to resonate with the proving grounds' seals. As thanks, I give you Stardew Lotus and a supreme elixir."
ec.content.dialogue.dlg_lyra_hub.post_ch1.text: "The stars have briefly regained calm. Yet I see a new ripple in the Azure Frostpeaks to the north... Until the day of departure, calm the sanctum's echoes and forge supreme gear."
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.enter_sanctum_post: "Challenge the cooperative dungeon \"Void Sanctum\" again"
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.open_shop_post: "View the Purified Starshard and Essence exchange"
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.start_s12: "Accept the repeatable quest \"Echoes of the Sanctum\""
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.complete_s12: "Report the repeatable quest \"Echoes of the Sanctum\""
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.complete_side_06_post: "Report the supply wagon escort (Supply Wagon Escort Route to the Hill - Report)"
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.start_side_07_post: "Accept the starshard impact site mana survey"
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.complete_side_07_post: "Report the starshard impact site mana survey"
ec.content.dialogue.dlg_lyra_hub.post_ch1.choice.bye_post: "I'll come again, Sage"
ec.content.dialogue.dlg_lyra_hub.s12_started.text: "Deep in the sanctum, the Void Core's echoes still materialize periodically. Gather companions and calm the echoes of the guards and the guardian."
ec.content.dialogue.dlg_lyra_hub.s12_done.text: "Splendid teamwork. The essence and Purified Starshards you brought will in time become supreme gear to support the harsh journey of Chapter 2."
ec.content.dialogue.dlg_minato_hub.name: "Minato the Azure Angler's Pier"
ec.content.dialogue.dlg_minato_hub.root.text: "Ah, nice calm! This is the south pier of the Azure Fishing Guild. Cast from the water's edge with a dedicated RPG fishing rod and bait, and you'll enjoy fishing with real feel, from the bobber's bite to tension management. Use your catch for cooking and deliveries!"
ec.content.dialogue.dlg_minato_hub.root.choice.open_angler_shop: "Open the Azure Fishing Guild Shop (rods, bait, fish dishes)"
ec.content.dialogue.dlg_minato_hub.root.choice.start_f01: "[Fishing] Accept \"First Azure Cast\" (beginner, rod provided)"
ec.content.dialogue.dlg_minato_hub.root.choice.complete_f01: "[Fishing] Complete \"First Azure Cast\""
ec.content.dialogue.dlg_minato_hub.root.choice.start_f02: "[Fishing] Accept \"Forest Stream and the Moonshadow Carp\" (Lv5+, unlocks a title)"
ec.content.dialogue.dlg_minato_hub.root.choice.complete_f02: "[Fishing] Report \"Forest Stream and the Moonshadow Carp\""
ec.content.dialogue.dlg_minato_hub.root.choice.start_f03: "[Fishing] Accept \"Seeking the Lords of Starsea and Ice Cavern\" (Lv14+, unlocks a title)"
ec.content.dialogue.dlg_minato_hub.root.choice.complete_f03: "[Fishing] Report \"Seeking the Lords of Starsea and Ice Cavern\""
ec.content.dialogue.dlg_minato_hub.root.choice.start_d01: "[Daily] Accept Minato's Fresh Fish Delivery (refreshes daily, Lv3+)"
ec.content.dialogue.dlg_minato_hub.root.choice.complete_d01: "[Daily] Report the Fresh Fish Delivery"
ec.content.dialogue.dlg_minato_hub.root.choice.fishing_tips: "Hear fishing tips and how to read fish shadows"
ec.content.dialogue.dlg_minato_hub.root.choice.bye: "I'll come cast a line again"
ec.content.dialogue.dlg_minato_hub.f01_started.text: "All right, first make a round of Lumina Port's waterside, then talk to me again. I'll provide the beginner \"Oak Azure Fishing Rod\" and Azure Worms!"
ec.content.dialogue.dlg_minato_hub.f01_done.text: "Welcome to the Azure Fishing Guild! Here's the \"Oak Azure Fishing Rod,\" Azure Worms, and a sample Silverscale Sardine. You can cook your catch into salt-grilled skewers at the shop, and I'm counting on you for the daily fresh fish deliveries!"
ec.content.dialogue.dlg_minato_hub.f02_started.text: "The clear streams of Ashwood Forest hold Sunbeam Trout, and the night-only Moonshadow Carp. Tour the forest streams and bring me 2 Sunbeam Trout!"
ec.content.dialogue.dlg_minato_hub.f02_done.text: "What fine trout! I present you the emblem of the title \"Azure Angler,\" plus the night's gift the \"Moonshadow Carp\" and a Starshard Lure. Next, try going for the big ones in the Stargazer Spring and the ice cavern!"
ec.content.dialogue.dlg_minato_hub.f03_started.text: "The Stargazer Spring's \"Milky Way Fish\" is a fantastic fish that bites Starshard Lures at night. Survey the waters of Stargazer Hill and the Azure Crystal Cavern, and bring back 2 Milky Way Fish!"
ec.content.dialogue.dlg_minato_hub.f03_done.text: "Magnificent, you really did it! I bestow upon you the title \"Grand Duke of the Starsea.\" Take the Abyss Angler, the legendary Azure Dragonfish, and a special \"Azure Ice Seafood Star Hotpot\" too!"
ec.content.dialogue.dlg_minato_hub.d01_started.text: "Today's fresh fish delivery. Check the waters toward Ashwood and bring 2 Silverscale Sardines. For a reward I'll have a Starshard Lure and salt-grilled skewers ready!"
ec.content.dialogue.dlg_minato_hub.d01_done.text: "Fresh and nicely sized! The harbor's meals are secure now. Do the same tomorrow when the day turns over!"
ec.content.dialogue.dlg_minato_hub.tips_node.text: "When a fish thrashes and the display turns red, don't force it; let go and release the tension. When it dives and turns blue, left-click to parry. The species you can target change with the time of day, weather, and bait combination, so try filling your codex!"
ec.content.dialogue.dlg_minato_hub.tips_node.choice.tips_back: "Thanks, that helps"
ec.content.dialogue.dlg_mira_hub.name: "Mira's Apothecary"
ec.content.dialogue.dlg_mira_hub.root.text: "Oh my, are you hurt? Before heading out on an adventure, don't forget healing potions and antidote herbs."
ec.content.dialogue.dlg_mira_hub.root.choice.open_shop: "Browse medicines and potions"
ec.content.dialogue.dlg_mira_hub.root.choice.start_s02: "Is there anything troubling you? (Mira's Herb Brewing - Accept)"
ec.content.dialogue.dlg_mira_hub.root.choice.complete_s02: "I gathered the Aether Jelly (Mira's Herb Brewing - Report)"
ec.content.dialogue.dlg_mira_hub.root.choice.start_side_02: "Help with the Moonshadow Herb efficacy survey (Moonshadow Herb Efficacy Survey - Accept)"
ec.content.dialogue.dlg_mira_hub.root.choice.complete_side_02: "Report the venom gland and forest herb survey (Moonshadow Herb Efficacy Survey - Report)"
ec.content.dialogue.dlg_mira_hub.root.choice.bye: "Thanks, I'll be back"
ec.content.dialogue.dlg_mira_hub.purify_discount.text: "Oh my, I heard you purified the forest's starshard! Elena told me. The herbs are delighted too. As thanks I'll give you a 10% discount forever!"
ec.content.dialogue.dlg_mira_hub.purify_discount.choice.open_shop_disc: "View medicines at the discounted price"
ec.content.dialogue.dlg_mira_hub.purify_discount.choice.start_s02_disc: "Is there anything troubling you? (Mira's Herb Brewing - Accept)"
ec.content.dialogue.dlg_mira_hub.purify_discount.choice.complete_s02_disc: "I gathered the Aether Jelly (Mira's Herb Brewing - Report)"
ec.content.dialogue.dlg_mira_hub.purify_discount.choice.start_side_02_disc: "Help with the Moonshadow Herb efficacy survey (Moonshadow Herb Efficacy Survey - Accept)"
ec.content.dialogue.dlg_mira_hub.purify_discount.choice.complete_side_02_disc: "Report the venom gland and forest herb survey (Moonshadow Herb Efficacy Survey - Report)"
ec.content.dialogue.dlg_mira_hub.purify_discount.choice.bye_disc: "Thanks, I'll be back"
ec.content.dialogue.dlg_mira_hub.s02_started.text: "You came at just the right time! Lately there are more injured folks, and I'm running short of the \"Aether Jelly\" I use as a binder for healing potions. Could you get about 6 from the forest slimes?"
ec.content.dialogue.dlg_mira_hub.s02_done.text: "Oh my, such wobbly, fresh jelly! Thank you so much. As thanks, here are freshly made healing potions and antidote herbs!"
ec.content.dialogue.dlg_mira_hub.side_02_started.text: "I hear that combining the Moonshadow Herb blooming in Ashwood Forest with venom glands makes a new Stardew elixir. Could you survey the forest and collect 4 Spore Spider venom glands?"
ec.content.dialogue.dlg_mira_hub.side_02_done.text: "Wow, I can make a perfect blend! As thanks I'll share 2 \"Stardew Lotus\" with you. Take them to Kaede's workshop and she'll make a superb elixir!"
ec.content.dialogue.dlg_nora_hub.name: "Nora the Frostpeak Naturalist"
ec.content.dialogue.dlg_nora_hub.root.text: "Oh, an adventurer from the south! I'm Nora, a naturalist compiling the Frostpeak monsters and starshard ecology. Could you help with my survey to complete this region's ecology codex?"
ec.content.dialogue.dlg_nora_hub.root.choice.start_side_08: "Take on \"Rime Ridge Ecology Field Guide\" (Lv17+)"
ec.content.dialogue.dlg_nora_hub.root.choice.complete_side_08: "Report the Rime Ridge ecology survey results (choose a policy)"
ec.content.dialogue.dlg_nora_hub.root.choice.start_side_09: "Take on \"Crystal Cavern Inscription Survey Escort\" (Lv18+)"
ec.content.dialogue.dlg_nora_hub.root.choice.start_h02: "[Hidden] Take on \"Exploring the Four Hidden Azure Islands\" (Lv19+)"
ec.content.dialogue.dlg_nora_hub.root.choice.complete_h02: "[Hidden] Hand Nora the Four Islands exploration record"
ec.content.dialogue.dlg_nora_hub.root.choice.bestiary_notes: "Read the Frostpeak and starshard monster codex notes"
ec.content.dialogue.dlg_nora_hub.root.choice.bye: "I'll come report on the survey again"
ec.content.dialogue.dlg_nora_hub.side_08_started.text: "Observe the behavior of 6 Rime Wolves and 5 Glacier Wraiths, and collect 4 frost crystal fragments. When you return, let's discuss whether to record this data for protection or send it to research!"
ec.content.dialogue.dlg_nora_hub.side_08_branch.text: "A splendid survey record! Tell me, should this rare frost crystal data be published as a \"conservation record\" for an ecosystem reserve application, or sent to the forge as \"specimen collection\" for cold-resistant gear research?"
ec.content.dialogue.dlg_nora_hub.side_08_branch.choice.choose_nora_preserve: "Preserve the Frostpeak ecosystem as a \"conservation record\" in the field guide"
ec.content.dialogue.dlg_nora_hub.side_08_branch.choice.choose_nora_specimen: "Use it for research as \"specimen collection\" for the expedition's safety"
ec.content.dialogue.dlg_nora_hub.side_08_done_preserve.text: "Thank you! After the starshard anomaly calms, I'll leave this conservation record to the future so the Frostpeak's life can keep thriving. Take the merit seal and Stardew Lotus as reward!"
ec.content.dialogue.dlg_nora_hub.side_08_done_specimen.text: "I see, protecting the front line's lives comes first now. I'll share the specimens with Orphe's analysis team too. Please take your reward!"
ec.content.dialogue.dlg_nora_hub.side_09_started.text: "We learned that ancient starshard inscriptions remain in the Azure Crystal Cavern. But inside it's crawling with frozen fanatics and Azure Frost Knights... Could you clear the passages, traverse the cavern, and deliver the survey records to Orphe?"
ec.content.dialogue.dlg_nora_hub.h02_started.text: "If you can repel the Frost Colossus, you can surely complete the \"Hidden Region Exploration Record\" covering all four Frostpeak islands: the outpost, Rime Ridge, the Azure Crystal Cavern, and the Azure Ice Citadel! Achieve it and I'll give you the title \"Frostpeak Pathfinder\" and a veteran's insignia!"
ec.content.dialogue.dlg_nora_hub.h02_done.text: "You really traversed all four islands...! This is a living Azure field guide. Take the promised \"Azure Veteran Adventurer's Insignia\" and the title \"Frostpeak Pathfinder\"!"
ec.content.dialogue.dlg_nora_hub.bestiary_node.text: "According to my codex notes, most Frostpeak enemies are weak to fire and starlight, and strongly resist ice. The Aether Chimera in the proving grounds, however, is weak to lightning and void. Switch among the Star Guide's lightning ring, the Shadowblade's void blade, and the Paladin's star wall for an advantage!"
ec.content.dialogue.dlg_nora_hub.bestiary_node.choice.bestiary_back: "That was helpful"
ec.content.dialogue.dlg_orphe_hub.name: "Orphe's Observation Records"
ec.content.dialogue.dlg_orphe_hub.root.text: "This is the observation tent of the Azure Frost Outpost. I am Orphe, Frostpeak observer and a disciple of Master Lyra. The starshard's cold-wave patterns are badly disturbed..."
ec.content.dialogue.dlg_orphe_hub.root.choice.complete_m01: "I joined on Captain Freya's orders (Voyage to the Azure Frostpeaks - Report)"
ec.content.dialogue.dlg_orphe_hub.root.choice.start_m02: "Take on restoring the Rime Ridge relay lights (Restoring the Rime Ridge Route - Accept)"
ec.content.dialogue.dlg_orphe_hub.root.choice.complete_m02: "I drove off the Rime Wolves and gathered furs (Restoring the Rime Ridge Route - Report)"
ec.content.dialogue.dlg_orphe_hub.root.choice.start_m03: "Investigate the starshard conduit's rampage (The Frozen Starshard Conduit - Accept)"
ec.content.dialogue.dlg_orphe_hub.root.choice.complete_m03: "Report the starshard conduit treatment results (The Frozen Starshard Conduit - Report)"
ec.content.dialogue.dlg_orphe_hub.root.choice.start_m06: "Take on breaking through the Azure Ice Citadel's main gate (The Ice Citadel Gate and Overseer Vesper - Accept)"
ec.content.dialogue.dlg_orphe_hub.root.choice.start_s02: "Help with the stabilized frost crystal resonance survey (Frost Crystal Resonance Survey - Accept)"
ec.content.dialogue.dlg_orphe_hub.root.choice.complete_s02: "I brought back the frost crystal resonance data (Frost Crystal Resonance Survey - Report)"
ec.content.dialogue.dlg_orphe_hub.root.choice.complete_side_09: "Deliver Nora's cavern inscription survey records (Crystal Cavern Inscription Survey Escort - Report)"
ec.content.dialogue.dlg_orphe_hub.root.choice.bye: "I'll come report again"
ec.content.dialogue.dlg_orphe_hub.m01_done.text: "You came! Just as Master Lyra said, you're someone I can count on. Let me brief you on the situation: the airship relay lights on the eastern Rime Ridge have frozen over, and supply flights can't approach."
ec.content.dialogue.dlg_orphe_hub.m01_done.choice.accept_m02_now: "Head to Rime Ridge right away (Restoring the Rime Ridge Route - Accept)"
ec.content.dialogue.dlg_orphe_hub.m01_done.choice.prep_m02: "I'll look at Borka's shop first"
ec.content.dialogue.dlg_orphe_hub.m02_started.text: "Drive off 6 \"Rime Wolves\" swarming Rime Ridge and collect 4 pelts for insulating the relay lights. Ice-type monsters are vulnerable to fire and lightning attacks!"
ec.content.dialogue.dlg_orphe_hub.m02_done.text: "Thank you, the relay lights are back on! But a more troublesome problem has surfaced. An ancient starshard conduit deep in the ridge keeps exhaling cold air, and \"Glacier Wraiths\" are spawning from it. A woman who left the cult, Seraphina, should be waiting there."
ec.content.dialogue.dlg_orphe_hub.m02_done.choice.accept_m03_now: "Go hear about the starshard conduit from Seraphina (The Frozen Starshard Conduit - Accept)"
ec.content.dialogue.dlg_orphe_hub.m02_done.choice.prep_m03: "I'll prepare before heading out"
ec.content.dialogue.dlg_orphe_hub.m03_started.text: "Calm 6 \"Glacier Wraiths\" on Rime Ridge, collect 4 frost crystal fragments, and make contact with Seraphina there. How to control the conduit... we'll make a major decision when you return."
ec.content.dialogue.dlg_orphe_hub.choice4_conduit.text: "Have you exchanged views with Seraphina? There are two ways to handle the starshard conduit. My plan, \"stable control at low temperature,\" protects the outpost's supply network and brings business to Borka's shop. Seraphina's plan, \"overheat thaw,\" would destroy the cult's ice cavern defenses all at once. ...I leave it to your judgment, having seen the site."
ec.content.dialogue.dlg_orphe_hub.choice4_conduit.choice.choose_stabilize: "Stabilize it at low temperature (Orphe's plan - defensive accessory + 10% discount at Borka's shop)"
ec.content.dialogue.dlg_orphe_hub.choice4_conduit.choice.choose_overload: "Overheat and thaw it to sever the cult's defenses (Seraphina's plan - offensive accessory + cult supply route cut)"
ec.content.dialogue.dlg_orphe_hub.choice4_conduit.choice.decide_later: "I'll keep surveying the ridge a bit more"
ec.content.dialogue.dlg_orphe_hub.choice4_stabilized.text: "Thank you! The conduit has stabilized in a safe low-temperature band, and the outpost's furnace is running smoothly. I'll tell Borka, too. Now let's complete the starshard conduit report!"
ec.content.dialogue.dlg_orphe_hub.choice4_stabilized.choice.finish_m03_stabilized: "Report the survey complete (The Frozen Starshard Conduit - Report)"
ec.content.dialogue.dlg_orphe_hub.choice4_stabilized.choice.finish_m03_later_s: "Finish the remaining hunting and collection first, then report"
ec.content.dialogue.dlg_orphe_hub.choice4_overloaded.text: "...A bold decision. Indeed, the ice wall at the cavern entrance crumbled with a roar, and the cult's spellwork was thrown into disarray. Seraphina surely won't miss this chance. Now let's complete the conduit report!"
ec.content.dialogue.dlg_orphe_hub.choice4_overloaded.choice.finish_m03_overloaded: "Report the survey complete (The Frozen Starshard Conduit - Report)"
ec.content.dialogue.dlg_orphe_hub.choice4_overloaded.choice.finish_m03_later_o: "Finish the remaining hunting and collection first, then report"
ec.content.dialogue.dlg_orphe_hub.m03_done.text: "The way to the eastern \"Azure Crystal Cavern\" is now open! Seraphina should be planning an infiltration of the cavern. Please meet up with her on Rime Ridge."
ec.content.dialogue.dlg_orphe_hub.m06_started.text: "The analysis of the frozen seal key is complete! At last it's time to storm the far eastern \"Azure Ice Citadel.\" Break through 4 \"Azure Ice Citadel Royal Guards\" at the main gate and face Frostpeak Overseer Vesper, who is surely waiting inside."
ec.content.dialogue.dlg_orphe_hub.citadel_ready.text: "The seal of the Azure Ice Citadel has been broken, and the teleport gate to the innermost throne is connected! You can enter alone, but the mighty Executor of the Ice Core awaits. Prepare yourself and challenge it."
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.start_m07_orphe: "Take the Cryo Archon subjugation (The Ice Core Executor - Accept)"
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.enter_citadel_orphe: "Enter the cooperative dungeon \"Azure Ice Citadel\""
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.start_s02_ready: "Accept the frost crystal resonance survey (Choice 4A only)"
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.complete_s02_ready: "Report the frost crystal resonance survey"
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.complete_side_09_ready: "Deliver Nora's cavern inscription survey records (Crystal Cavern Inscription Survey Escort - Report)"
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.archon_tips: "Hear advice for beating Cryo Archon"
ec.content.dialogue.dlg_orphe_hub.citadel_ready.choice.bye_citadel: "I'll prepare before taking it on"
ec.content.dialogue.dlg_orphe_hub.m07_started.text: "If we don't stop the \"Cryo Archon, Executor of the Ice Core\" that Vesper activated, the Azure Frostpeaks will become an eternal block of ice. Defeat it, recover the Azure Ice Core Remnant, and report to Captain Freya at Lumina Port!"
ec.content.dialogue.dlg_orphe_hub.tips_archon.text: "Cryo Archon is a three-phase ice-type boss. Fire and aether are its weaknesses. During the midgame \"Absolute Zero Piercing Light,\" dodge sideways immediately from the line warning, and prepare for the final \"Eternal Azure Blizzard\" with cold-resistance elixirs or defensive buffs!"
ec.content.dialogue.dlg_orphe_hub.tips_archon.choice.tips_back: "I'll keep it in mind"
ec.content.dialogue.dlg_orphe_hub.s02_started.text: "A rare resonance waveform has been observed from the conduit stabilized at low temperature. Could you calm 5 Glacier Wraiths on Rime Ridge and collect 5 frost crystal fragments?"
ec.content.dialogue.dlg_orphe_hub.s02_done.text: "Wonderful resonance records! Now I can report proudly to Master Lyra. Please take these Azure Frost Shards and a mana tonic as thanks!"
ec.content.dialogue.dlg_orphe_hub.side_09_done.text: "Nora's copy of the cavern inscriptions! This is decisive proof that the ancient Frostpeaks had a starshard control facility. As thanks for the escort, take an Artisan's Polishing Whetstone and a supreme Stardew elixir!"
ec.content.dialogue.dlg_orphe_hub.global.choice.airship_to_lumina: "Return to Lumina Port by airship"
ec.content.dialogue.dlg_pip_hub.name: "Pip's Stall"
ec.content.dialogue.dlg_pip_hub.root.text: "Hehe, boss! Lumina Port's famous seafood stew, return scrolls, even buying monster materials you don't need, I handle it all! Oh, between us, there's a rumor that hooded folks in black have been mixed in with the port's cargo unloading lately?"
ec.content.dialogue.dlg_pip_hub.root.choice.open_shop: "Browse sundries and food (selling materials is also possible)"
ec.content.dialogue.dlg_pip_hub.root.choice.start_s04: "I heard you've got a money-making deal? (Pip's Secret Stock - Accept)"
ec.content.dialogue.dlg_pip_hub.root.choice.complete_s04: "I brought 5 spore venom glands (Pip's Secret Stock - Report)"
ec.content.dialogue.dlg_pip_hub.root.choice.start_side_01: "Ask about the cargo that vanished from the port (The Harbor Smugglers and the Missing Cargo - Accept)"
ec.content.dialogue.dlg_pip_hub.root.choice.complete_side_01: "I took the cargo back from the smugglers (The Harbor Smugglers and the Missing Cargo - Report)"
ec.content.dialogue.dlg_pip_hub.root.choice.bye: "I'll peek in again"
ec.content.dialogue.dlg_pip_hub.s04_started.text: "Hehe, boss! Between us, spore spider venom glands sell for a high price to alchemists on the neighboring floating island! Gather 5 and I'll pay double the market rate!"
ec.content.dialogue.dlg_pip_hub.s04_done.text: "Oh wow, flawless top-grade goods! Thanks a lot! If I get another good deal, you'll be the first I call, boss!"
ec.content.dialogue.dlg_pip_hub.side_01_started.text: "Boss, I have a favor to ask! Food and fur cargo vanished from the port warehouse, and it seems the Moss Goblins in the forest carried it off! Punish 5 goblins and bring back 3 moss leather!"
ec.content.dialogue.dlg_pip_hub.side_01_branch.text: "Oh, you really got the cargo back! By the way boss, this surplus food whose owner is unknown, should we return it to the original port trading company, or distribute it to the settlers in need?"
ec.content.dialogue.dlg_pip_hub.side_01_branch.choice.choose_pip_return: "Do the right thing and return it to the port trading company"
ec.content.dialogue.dlg_pip_hub.side_01_branch.choice.choose_pip_donate: "Distribute it to the settlers who evacuated here"
ec.content.dialogue.dlg_pip_hub.side_01_done_return.text: "Hehe, business runs on trust, right! The company's big boss was overjoyed and paid a handsome reward. Please take a merit seal too!"
ec.content.dialogue.dlg_pip_hub.side_01_done_donate.text: "You're a classy one, boss! The settlers wept for joy. Please accept the merit seal and healing potion as thanks!"
ec.content.dialogue.dlg_ren_hub.name: "Ren the Guild Recorder's Counter"
ec.content.dialogue.dlg_ren_hub.root.text: "Welcome to the Adventurer's Record counter! I'm Ren, the guild recorder. Leave daily and weekly quest acceptance, merit seal exchange, and title and ecology record inquiries to me."
ec.content.dialogue.dlg_ren_hub.root.choice.open_chronicle_shop: "Open the merit exchange (new class gear / merit seal exchange)"
ec.content.dialogue.dlg_ren_hub.root.choice.claim_bounty_pack: "Receive the Adventurer's Record registration gift (first time only)"
ec.content.dialogue.dlg_ren_hub.root.choice.start_d01: "[Daily] Accept \"Guild Daily Hunting Order\" (Lv6+)"
ec.content.dialogue.dlg_ren_hub.root.choice.complete_d01: "[Daily] Report the Daily Hunting Order"
ec.content.dialogue.dlg_ren_hub.root.choice.start_d02: "[Daily] Accept \"Northern Frostpeak Patrol Sweep\" (Lv16+)"
ec.content.dialogue.dlg_ren_hub.root.choice.complete_d02: "[Daily] Report \"Northern Frostpeak Patrol Sweep\""
ec.content.dialogue.dlg_ren_hub.root.choice.start_w01: "[Weekly] Accept \"Great Subjugation of the Three Mighty Foes\" (Lv14+)"
ec.content.dialogue.dlg_ren_hub.root.choice.complete_w01: "[Weekly] Report \"Great Subjugation of the Three Mighty Foes\""
ec.content.dialogue.dlg_ren_hub.root.choice.start_h01: "[Hidden] Ask about the lost predecessor's survey journal (Lv13+)"
ec.content.dialogue.dlg_ren_hub.root.choice.complete_h01: "[Hidden] Hand Ren the sealed survey journal"
ec.content.dialogue.dlg_ren_hub.root.choice.check_titles: "View achievement, title, and codex records"
ec.content.dialogue.dlg_ren_hub.root.choice.bye: "I'll come update my records again"
ec.content.dialogue.dlg_ren_hub.bounty_pack_done.text: "Welcome to the \"Azure Adventurer Chronicles\"! For your long journey, I give you \"Herb-Grilled Azure Salmon.\" Collect merit seals from dailies and weeklies and you can exchange them for new-class gear and polishing whetstones."
ec.content.dialogue.dlg_ren_hub.d01_started.text: "Today's hunting order! Defeat 6 Thorn Wolves in Ashwood Forest and 6 Void Coal Miners in the Weeping Mine and report in. You can take it again every 24 hours."
ec.content.dialogue.dlg_ren_hub.d01_done.text: "Good work! Here are your merit seals and an Artisan's Polishing Whetstone. Please make use of tomorrow's order, too."
ec.content.dialogue.dlg_ren_hub.d02_started.text: "A patrol request from the Northern Expedition. Sweep 6 Rime Wolves and 6 Frozen Fanatics to secure the front line!"
ec.content.dialogue.dlg_ren_hub.d02_done.text: "Your performance in the freezing Frostpeaks is duly recorded! Please take merit seals and Azure Frost Shards."
ec.content.dialogue.dlg_ren_hub.w01_started.text: "This week's special great subjugation! Conquer the three mighty foes: 5 Obsidian Golems, 5 Void Core Sentries, and 5 Azure Frost Heavy Knights. The reward is a lavish once-per-7-days package!"
ec.content.dialogue.dlg_ren_hub.w01_done.text: "Magnificent! Conquering the three mighty foes... I present 8 merit seals, 2 Starshard Trial Medals, and 3 polishing whetstones!"
ec.content.dialogue.dlg_ren_hub.h01_started.text: "Actually... there's information that cultists on Stargazer Hill took the \"Sealed Survey Journal\" left by the predecessor expedition. If you recover it, I'll confer the guild-certified title \"Truth Seeker\"!"
ec.content.dialogue.dlg_ren_hub.h01_done.text: "...This is the predecessor expedition's journal! The record of the shadow stirring behind the starshard crash is vividly preserved. As promised, I've carved the title \"Truth Seeker\" into your Adventurer's Record!"
ec.content.dialogue.dlg_ren_hub.titles_menu.text: "I'll look up the title records carved into your Adventurer's Record. By completing hidden quests and conquering the Starshard Proving Grounds, honorable titles will be unlocked."
ec.content.dialogue.dlg_ren_hub.titles_menu.choice.title_truth_status: "[Title] Truth Seeker (achieved)"
ec.content.dialogue.dlg_ren_hub.titles_menu.choice.title_frost_status: "[Title] Frostpeak Pathfinder (achieved)"
ec.content.dialogue.dlg_ren_hub.titles_menu.choice.title_crucible_status: "[Title] Champion of the Starshard Trial (achieved)"
ec.content.dialogue.dlg_ren_hub.titles_menu.choice.titles_back: "Back to the counter"
ec.content.dialogue.dlg_ren_hub.title_truth_detail.text: "\"Truth Seeker\" - proof of an explorer who recovered the sealed survey journal and closed in on the truth of the starshard anomaly."
ec.content.dialogue.dlg_ren_hub.title_truth_detail.choice.back_from_truth: "Back"
ec.content.dialogue.dlg_ren_hub.title_frost_detail.text: "\"Frostpeak Pathfinder\" - proof of a surveyor who traversed all four islands from the Azure Frost Outpost to the Ice Citadel."
ec.content.dialogue.dlg_ren_hub.title_frost_detail.choice.back_from_frost: "Back"
ec.content.dialogue.dlg_ren_hub.title_crucible_detail.text: "\"Champion of the Starshard Trial\" - proof of a mighty adventurer who defeated the Aether Chimera, Fusion of Starcores."
ec.content.dialogue.dlg_ren_hub.title_crucible_detail.choice.back_from_crucible: "Back"
ec.content.dialogue.dlg_rook_arena.name: "Instructor Rook the Novice Trial Guide"
ec.content.dialogue.dlg_rook_arena.root.text: "Hey there, rising adventurer! I'm Rook, the novice trial instructor. Once you pass Lv5, try the \"Novice Trial Arena\" for 3 consecutive waves of live combat training and time attacks!"
ec.content.dialogue.dlg_rook_arena.root.choice.unlock_novice_arena: "Receive the Novice Trial Arena participation pass (Lv5+)"
ec.content.dialogue.dlg_rook_arena.root.choice.open_arena_shop_locked: "View the arena reward shop"
ec.content.dialogue.dlg_rook_arena.root.choice.arena_explain: "Ask about the Novice Trial Arena's rules"
ec.content.dialogue.dlg_rook_arena.root.choice.bye_locked: "I'll come back at Lv5 after enhancing my gear"
ec.content.dialogue.dlg_rook_arena.arena_info.text: "The Novice Trial Arena is a 3-wave mini challenge for solo players and small squads, made of Ashwood monsters. Alpha, \"Ashwood Alpha, Beastking of the Ashen Forest,\" awaits in the final wave. Your personal best is recorded as S rank within 120 seconds, A rank within 210 seconds!"
ec.content.dialogue.dlg_rook_arena.arena_info.choice.back_from_info: "Got it, I'll hone my skills and take it on"
ec.content.dialogue.dlg_rook_arena.arena_unlocked.text: "All right, I acknowledge your qualification! First accept the first-clear quest, then step into the arena. If you enhance your weapon and Star Charm to +1 through +3 and carry Herb-Fried Harbor Goby and nourishing soup, you're all set!"
ec.content.dialogue.dlg_rook_arena.arena_unlocked.choice.accept_t01_now: "[Trial] Accept \"Novice Arena: Beastking Alpha Subjugation\""
ec.content.dialogue.dlg_rook_arena.arena_unlocked.choice.go_unlocked_menu: "Proceed to the arena menu"
ec.content.dialogue.dlg_rook_arena.unlocked_root.text: "The Novice Trial Arena is always open! Aim for S rank (within 120 seconds) by cutting your time, or collect the Beastking's Star Fangs and trade them for the Beastking Starfang Talisman or polishing whetstones!"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.enter_novice_arena: "Enter the Novice Trial Arena (Lv5-8, 3 waves)"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.open_arena_shop: "Open the arena reward shop (Star Fang exchange / recovery food)"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.start_t01: "[Trial] Accept \"Novice Arena: Beastking Alpha Subjugation\" (first time)"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.complete_t01: "[Trial] Report the first Beastking Alpha subjugation"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.start_t02: "[Trial Daily] Accept \"Novice Arena Time Attack\" (Lv6+)"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.complete_t02: "[Trial Daily] Report the Time Attack challenge"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.alpha_tips: "Ask for tips to beat Beastking Alpha"
ec.content.dialogue.dlg_rook_arena.unlocked_root.choice.bye_unlocked: "I'll prepare and challenge it again"
ec.content.dialogue.dlg_rook_arena.alpha_strategy.text: "Beastking Alpha is weak to fire and aether but resists ice. Below 45% HP it uses \"Beastking's Great Leap\" and attacks faster. When you see the red warning, dodge sideways and hit it with your skills!"
ec.content.dialogue.dlg_rook_arena.alpha_strategy.choice.back_from_strat: "I'll remember that"
ec.content.dialogue.dlg_rook_arena.t01_started.text: "Quest accepted! Report to me once you've defeated Beastking Alpha in wave 3. Your first clear will also unlock the title \"Novice Arena Victor\"!"
ec.content.dialogue.dlg_rook_arena.t01_done.text: "Magnificent, you defeated Beastking Alpha! Take your rewards, the \"Beastking's Star Fang\" and \"Artisan's Polishing Whetstone.\" From now on you can take on the daily time attack quest too!"
ec.content.dialogue.dlg_rook_arena.t02_started.text: "Today's time attack quest! Aim to beat your personal best and dash through all 3 waves!"
ec.content.dialogue.dlg_rook_arena.t02_done.text: "Nice moves! Take your Star Fangs and badges and trade them at the reward shop for the Beastking Starfang Talisman or polishing whetstones!"
ec.content.dialogue.dlg_seraphina_hub.name: "Seraphina's Secret Talk"
ec.content.dialogue.dlg_seraphina_hub.root.text: "...I'm surprised, a guild adventurer actually made it this far. I'm Seraphina. Until recently I was the Frostpeak scribe of the Hollow Hand, but I'm under no obligation to indulge Vesper's madness."
ec.content.dialogue.dlg_seraphina_hub.root.choice.conduit_advice: "Ask about the starshard conduit's rampage"
ec.content.dialogue.dlg_seraphina_hub.root.choice.bye: "I'll hear more later"
ec.content.dialogue.dlg_seraphina_hub.advice_node.text: "Vesper intends to run the cooling conduits wild and freeze the entire Frostpeaks. If you want to quickly break the cult's defense lines, overheating and thawing the conduit to blow away the ice wall is the rational way. ...Though that earnest observer would push stable control. Make your decision with Orphe."
ec.content.dialogue.dlg_seraphina_hub.advice_node.choice.ack_advice: "I've heard your view, I'll return to Orphe"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.text: "The Azure Crystal Cavern is open to you now. From here it's my specialty: I'll lay bare the cult's ciphers and the cavern's defense mechanisms. Ready?"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.start_m04: "Take on infiltrating the Azure Crystal Cavern (Infiltrating the Crystal Cavern - Accept)"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.complete_m04: "I took the cipher table from the Frost Mages (Infiltrating the Crystal Cavern - Report)"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.start_m05: "Take the Frost Colossus subjugation (Shatter the Frostiron Sentinel - Accept)"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.complete_m05: "I defeated the Frost Colossus and recovered the seal key (Shatter the Frostiron Sentinel - Report)"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.start_s03: "Ask about cutting the cult's supply network (The Cult's Frostpeak Ledger - Accept)"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.complete_s03: "I seized the Frost Mages' supplies (The Cult's Frostpeak Ledger - Report)"
ec.content.dialogue.dlg_seraphina_hub.cavern_ops.choice.bye_cavern: "I'll be right back"
ec.content.dialogue.dlg_seraphina_hub.m04_started.text: "Defeat 6 \"Frost Mages\" lurking in the Azure Crystal Cavern and steal the \"Cult Frostpeak Cipher Table\" they carry. With it we can pinpoint the location of the seal key leading to the Ice Citadel."
ec.content.dialogue.dlg_seraphina_hub.m04_done.text: "Impressive work. ...Hm, I've deciphered the code. The \"Azure Ice Citadel Frozen Seal Key\" that opens the citadel's main gate is built into the furnace core of the ancient frostiron sentinel \"Frost Colossus\" sleeping deep in the cavern."
ec.content.dialogue.dlg_seraphina_hub.m04_done.choice.accept_m05_now: "Go defeat the Frost Colossus (Shatter the Frostiron Sentinel - Accept)"
ec.content.dialogue.dlg_seraphina_hub.m04_done.choice.prep_m05: "I'll resupply before taking it on"
ec.content.dialogue.dlg_seraphina_hub.m05_started.text: "The Frost Colossus is a heavily armored ice giant. Fire and lightning are its weaknesses, but \"Avalanche Charge\" and \"Cryogenic Core Vent\" are dangerous on a direct hit, so watch the warnings and dodge. When you retrieve the seal key, bring it here."
ec.content.dialogue.dlg_seraphina_hub.m05_done.text: "You really shattered that frostiron giant... As thanks I'll give you a top-grade offhand taken from the cult's hidden storehouse. Hand the seal key to Orphe at the outpost. Now it's the Azure Ice Citadel and Vesper's turn."
ec.content.dialogue.dlg_seraphina_hub.after_colossus.text: "We have the seal key. Ask Orphe at the outpost to analyze the citadel gate. ...Beware of Vesper; for his convictions that man would freeze the whole floating island."
ec.content.dialogue.dlg_seraphina_hub.after_colossus.choice.complete_m05_after: "Report the Frost Colossus subjugation (Shatter the Frostiron Sentinel - Report)"
ec.content.dialogue.dlg_seraphina_hub.after_colossus.choice.start_s03_after: "Accept the Cult's Frostpeak Ledger (Choice 4B only)"
ec.content.dialogue.dlg_seraphina_hub.after_colossus.choice.complete_s03_after: "Report the Cult's Frostpeak Ledger"
ec.content.dialogue.dlg_seraphina_hub.after_colossus.choice.bye_after: "I'll definitely stop him"
ec.content.dialogue.dlg_seraphina_hub.s03_started.text: "Thanks to the overheat thaw, the cult's cavern supply routes are in plain sight. Strike down 5 Frost Mages now and seize the 4 Azure Frost Shards they hid. I'll make your cut generous."
ec.content.dialogue.dlg_seraphina_hub.s03_done.text: "The cavern's supply network is now completely dried up. As promised, here are extra Azure Frost Shards and a cold-resistance elixir. Use them well."
ec.content.dialogue.dlg_soren_hub.name: "Soren the Proving Grounds Keeper"
ec.content.dialogue.dlg_soren_hub.root.text: "Welcome to the \"Starshard Proving Grounds\" sleeping deep in Stargazer Hill. I'm Soren, the keeper. Are you willing to test your skills on a battlefield where void and azure frost intersect?"
ec.content.dialogue.dlg_soren_hub.root.choice.unlock_crucible: "Break the Starshard Proving Grounds' seal (requires Chapter 1 clear, Lv18+)"
ec.content.dialogue.dlg_soren_hub.root.choice.explain_crucible: "Ask about the Starshard Proving Grounds"
ec.content.dialogue.dlg_soren_hub.root.choice.bye: "I'll come again when I'm ready"
ec.content.dialogue.dlg_soren_hub.crucible_info.text: "The Starshard Proving Grounds is a high-difficulty challenge dungeon born from the fusion of Chapter 1's Void Core and Chapter 2's azure frost remnants. I entrust the entry key only to those who have cleared Chapter 1 and reached level 18."
ec.content.dialogue.dlg_soren_hub.crucible_info.choice.back_from_info: "Got it, I'll hone my skills"
ec.content.dialogue.dlg_soren_hub.crucible_unlocked.text: "Fine strength indeed! I've just granted you entry to the \"Starshard Proving Grounds.\" Inside, Void Core Sentries and Azure Frost Heavy Knights block the way, and deep within the \"Aether Chimera, Fusion of Starcores\" awaits."
ec.content.dialogue.dlg_soren_hub.crucible_unlocked.choice.accept_c01_now: "[Trial] Accept the Fusion Subjugation request"
ec.content.dialogue.dlg_soren_hub.crucible_unlocked.choice.go_unlocked_root: "Open the Proving Grounds menu"
ec.content.dialogue.dlg_soren_hub.unlocked_root.text: "The gates of the Starshard Proving Grounds are open. The Aether Chimera is weak to lightning and void, but its freezing, void venom, and the late-game Starcore Collapse Nova can't be endured with ordinary gear."
ec.content.dialogue.dlg_soren_hub.unlocked_root.choice.enter_crucible: "Enter the challenge dungeon \"Starshard Proving Grounds\""
ec.content.dialogue.dlg_soren_hub.unlocked_root.choice.start_c01: "[Trial] Accept \"Starshard Proving Grounds: Fusion Subjugation\" (24-hour repeat)"
ec.content.dialogue.dlg_soren_hub.unlocked_root.choice.complete_c01: "[Trial] Report the Aether Chimera subjugation"
ec.content.dialogue.dlg_soren_hub.unlocked_root.choice.chimera_tips: "Hear advice for beating the Aether Chimera"
ec.content.dialogue.dlg_soren_hub.unlocked_root.choice.bye_unlocked: "I'll prepare my gear before taking it on"
ec.content.dialogue.dlg_soren_hub.c01_started.text: "All right, quest accepted! Step into the proving grounds, defeat the Aether Chimera, and return. If it's your first clear, I'll also grant the title \"Champion of the Starshard Trial\"!"
ec.content.dialogue.dlg_soren_hub.c01_done.text: "Magnificent... you conquered that fusion! Take the promised \"Starshard Trial Medal\" and the title \"Champion of the Starshard Trial.\" The medal can be forged into legendary gear and crests at Kaede's workshop in the port!"
ec.content.dialogue.dlg_soren_hub.tips_node.text: "At the entrance, a mixed escort of Void Core Sentries and Azure Frost Heavy Knights will intercept you. The chimera itself unlocks \"Void Venom Spore Cloud\" and \"Azure Frost Wedge (freeze)\" at 65% HP, and unleashes the wide-area \"Starcore Collapse Nova\" at 30% HP. Don't miss the warnings, dodge, and combine the Paladin's shield, the Star Guide's healing, and the Shadowblade's void combos!"
ec.content.dialogue.dlg_soren_hub.tips_node.choice.back_from_tips: "I'll take it to heart"
ec.content.dialogue.dlg_tomas_hub.name: "Tomas's Supply Post"
ec.content.dialogue.dlg_tomas_hub.root.text: "According to the records, monsters' toughness jumps from here on. What keeps you alive is spare healing potions, not courage. Are your supplies in order?"
ec.content.dialogue.dlg_tomas_hub.root.choice.open_shop: "Buy supplies and gear"
ec.content.dialogue.dlg_tomas_hub.root.choice.complete_m04: "Report the Shaft 1 survey (Into the Weeping Mine - Report)"
ec.content.dialogue.dlg_tomas_hub.root.choice.start_m05: "Investigate the cult's mining outpost (The Black Letter and Betrayal - Accept)"
ec.content.dialogue.dlg_tomas_hub.root.choice.complete_m05: "Report on the secret letter and Daren (The Black Letter and Betrayal - Report)"
ec.content.dialogue.dlg_tomas_hub.root.choice.start_m06: "Subdue the mining giant in Shaft 3 (The Rampaging Mining Giant - Accept)"
ec.content.dialogue.dlg_tomas_hub.root.choice.complete_m06: "I defeated the Iron Grinder! (The Rampaging Mining Giant - Report)"
ec.content.dialogue.dlg_tomas_hub.root.choice.start_s07: "Take the mine bounty hunt (Mine Cleanup Bounty - Accept)"
ec.content.dialogue.dlg_tomas_hub.root.choice.complete_s07: "I defeated the Obsidian Golems and Hollow Miners (Mine Cleanup Bounty - Report)"
ec.content.dialogue.dlg_tomas_hub.root.choice.start_s09: "Take the emergency supply corps audit (Emergency Supply Corps Audit - Accept)"
ec.content.dialogue.dlg_tomas_hub.root.choice.complete_side_03: "Report the wounded scout escort complete from Captain Elena (Escort the Wounded Scout Home - Report)"
ec.content.dialogue.dlg_tomas_hub.root.choice.start_side_06: "Take on escorting the supply wagon to Stargazer Hill (Supply Wagon Escort Route to the Hill - Accept)"
ec.content.dialogue.dlg_tomas_hub.root.choice.bye: "I'll come back later"
ec.content.dialogue.dlg_tomas_hub.extract_supply.text: "Special supplies have arrived from Guildmaster Vulcan following the forest starshard extraction. As per regulations, I issue you 3 intermediate healing potions. Make good use of them."
ec.content.dialogue.dlg_tomas_hub.extract_supply.choice.take_supply: "Receive the special supplies"
ec.content.dialogue.dlg_tomas_hub.m04_done.text: "So the Hollow Hand cult has been sneaking into the mine after all... But it doesn't add up. How did they get through Shaft 3's strict seal?"
ec.content.dialogue.dlg_tomas_hub.m05_started.text: "The cult's novice followers have built a mining outpost deep in Shaft 2. To find their chain of command, eliminate the followers and seize their correspondence."
ec.content.dialogue.dlg_tomas_hub.m05_done.text: "...I see, I've recorded your decision. In any case, a huge mana furnace has started up deep in Shaft 3. Take the seal key and go suppress it immediately!"
ec.content.dialogue.dlg_tomas_hub.m06_started.text: "The cult is forcing starshards into the ancient mining giant \"Iron Grinder\" to stall us. It's a tough one; form a party with allies if you need to!"
ec.content.dialogue.dlg_tomas_hub.m06_done.text: "Excellent! You silenced the giant... But the cult executive \"Kain\" has already taken the starshard and appears to be headed to Stargazer Hill in the north. Join Sage Lyra at the observatory ruins on the hill!"
ec.content.dialogue.dlg_tomas_hub.s07_started.text: "Securing the supply route is urgent. The guild has placed a bounty on the Obsidian Golems and Hollow Miners in Shaft 2. Defeat the required number and I'll issue a proper reward and reinforced greaves."
ec.content.dialogue.dlg_tomas_hub.s07_done.text: "Defeat confirmed. By my calculation, the convoy loss rate should drop by about 40%. As per regulations, here are the reward and reinforced greaves."
ec.content.dialogue.dlg_tomas_hub.s09_started.text: "Daren's accusation has exposed the ledger of guild supplies that were being diverted. Eliminate the escorting followers, recover the Void Dust as evidence, and report to Guildmaster Vulcan."
ec.content.dialogue.dlg_tomas_hub.side_03_done.text: "Handover of the wounded scout confirmed. Thanks to you, the medical team can transport him quickly. Please accept the standard merit seal and healing potion."
ec.content.dialogue.dlg_tomas_hub.side_06_started.text: "I want to send a supply wagon to Stargazer Hill, but Crystal Bats and cultists are ambushing along the route. Sweep the path and, once at the hill, report your arrival to Sage Lyra."
ec.content.dialogue.dlg_vesper_hub.name: "Vesper's Pronouncement"
ec.content.dialogue.dlg_vesper_hub.root.text: "...Fools. The silence of absolute zero is the only salvation to preserve the shattered sky forever. Still, I will grant that you have the courage to have fought through the royal guard to get here."
ec.content.dialogue.dlg_vesper_hub.root.choice.complete_m06: "I came to stop the Azure Ice Core's rampage (The Ice Citadel Gate and Overseer Vesper - Report)"
ec.content.dialogue.dlg_vesper_hub.root.choice.bye: "Prepare yourself, Vesper"
ec.content.dialogue.dlg_vesper_hub.m06_done.text: "Heh heh... The \"second Starshard\" has already fully awakened in the Ice Citadel's depths. The \"Cryo Archon, Executor of the Ice Core\" guarding the throne will freeze your heat and your hope alike. Now, the gate is open. Come and bite down on your own powerlessness!"
ec.content.dialogue.dlg_vesper_hub.m06_done.choice.accept_m07_now: "Defeat Cryo Archon (The Ice Core Executor - Accept)"
ec.content.dialogue.dlg_vesper_hub.m06_done.choice.enter_after_m06: "Challenge the cooperative dungeon \"Azure Ice Citadel\""
ec.content.dialogue.dlg_vesper_hub.m06_done.choice.withdraw_m06: "Prepare before taking it on"
ec.content.dialogue.dlg_vesper_hub.citadel_open.text: "The Ice Citadel's throne stands open. Try and see whether you can withstand Cryo Archon's absolute zero."
ec.content.dialogue.dlg_vesper_hub.citadel_open.choice.start_m07_open: "Take the Cryo Archon subjugation (The Ice Core Executor - Accept)"
ec.content.dialogue.dlg_vesper_hub.citadel_open.choice.enter_citadel_vesper: "Enter the cooperative dungeon \"Azure Ice Citadel\""
ec.content.dialogue.dlg_vesper_hub.citadel_open.choice.bye_open: "I'll be right back"
ec.content.dialogue.dlg_vesper_hub.m07_started.text: "You mean to defeat the Ice Executor? Interesting. Then burn the true power of the Azure Ice Core into your eyes at the throne in the depths."
ec.content.dialogue.dlg_vesper_hub.post_archon.text: "...Impossible, to break even the Executor Cryo Archon. But don't celebrate yet. The \"third Starshard\" is already awakening in the scorching south, the Crimson Crater. I will be waiting there, meddler of starshards...! (Only the echoes resounded through the ice corridor)"
ec.content.dialogue.dlg_vesper_hub.post_archon.choice.enter_citadel_rematch: "Challenge the echoes of the Azure Ice Citadel again"
ec.content.dialogue.dlg_vesper_hub.post_archon.choice.bye_post: "Go back and report to Captain Freya"
ec.content.dialogue.dlg_vulcan_hub.name: "Vulcan's Orders"
ec.content.dialogue.dlg_vulcan_hub.root.text: "Hey, partner! How are you holding up? Don't overdo it; I'm trusting you to cover my back."
ec.content.dialogue.dlg_vulcan_hub.root.choice.complete_m01: "I finished greeting Garudo (The Azure Harbor Town - Report)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.start_m02: "Ask about the strange changes in the forest (Strange Changes in the Forest and First Battle - Accept)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.complete_m03: "Report on the forest starshard and the black wedges (The Rampaging Starshard - Report)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.start_m04: "Take on the Weeping Mine survey (Into the Weeping Mine - Accept)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.start_s03: "Take the highway monster hunt (Fangs Threatening the Highway - Accept)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.complete_s03: "Report the wolf and goblin subjugation (Fangs Threatening the Highway - Report)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.complete_s09: "Submit the supply corps audit report (Emergency Supply Corps Audit - Report)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.start_s11: "Take the cult sweep at Stargazer Hill (Purging the Black Shadows - Repeatable Accept)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.complete_s11: "Report the cult sweep (Purging the Black Shadows - Report)"
ec.content.dialogue.dlg_vulcan_hub.root.choice.bye: "I'll come report again"
ec.content.dialogue.dlg_vulcan_hub.class_select.text: "Hahaha! So you're the newcomer Celia mentioned. You've got good eyes! First, decide your position on the battlefield, your \"class\". Which path will you choose?"
ec.content.dialogue.dlg_vulcan_hub.class_select.choice.preview_warrior: "Warrior - guards the front line with shield and greatsword"
ec.content.dialogue.dlg_vulcan_hub.class_select.choice.preview_archer: "Archer - pierces foes with mobility and critical strikes"
ec.content.dialogue.dlg_vulcan_hub.class_select.choice.preview_mage: "Mage - controls the battle with elemental magic and support"
ec.content.dialogue.dlg_vulcan_hub.class_select.choice.preview_paladin: "Paladin - the tank who holds the front line with overwhelming defense and star-shield healing"
ec.content.dialogue.dlg_vulcan_hub.class_select.choice.preview_cleric: "Star Guide - a support healer with high healing, defensive support, and starlight and lightning magic"
ec.content.dialogue.dlg_vulcan_hub.class_select.choice.preview_assassin: "Shadowblade - an assassin melee fighter who cuts weak points with the highest crits and void and ice combos"
ec.content.dialogue.dlg_vulcan_hub.confirm_warrior.text: "A warrior, then! High HP and defense, and the melee linchpin who unleashes stored \"Rage.\" In co-op fights you can be your allies' shield too. Is this the one?"
ec.content.dialogue.dlg_vulcan_hub.confirm_warrior.choice.choose_warrior: "I'll be a Warrior!"
ec.content.dialogue.dlg_vulcan_hub.confirm_warrior.choice.back_from_warrior: "I want to see other classes"
ec.content.dialogue.dlg_vulcan_hub.confirm_archer.text: "An archer! A hunter who hones \"Focus\" and pierces weak points from range. You can toy with powerful foes through evasion and sheer volume of attacks. Is this the one?"
ec.content.dialogue.dlg_vulcan_hub.confirm_archer.choice.choose_archer: "I'll be an Archer!"
ec.content.dialogue.dlg_vulcan_hub.confirm_archer.choice.back_from_archer: "I want to see other classes"
ec.content.dialogue.dlg_vulcan_hub.confirm_mage.text: "A mage! A brainy type who wields \"Mana\" to cast wide-area elemental magic and support allies. Fragile, but unmatched firepower. Is this the one?"
ec.content.dialogue.dlg_vulcan_hub.confirm_mage.choice.choose_mage: "I'll be a Mage!"
ec.content.dialogue.dlg_vulcan_hub.confirm_mage.choice.back_from_mage: "I want to see other classes"
ec.content.dialogue.dlg_vulcan_hub.confirm_paladin.text: "A paladin! The highest HP, defense, and elemental resistance of all classes, plus star-shield defense buffs and self-healing to take a powerful foe's assault head-on, an impregnable fortress. Is this the one?"
ec.content.dialogue.dlg_vulcan_hub.confirm_paladin.choice.choose_paladin: "I'll be a Paladin!"
ec.content.dialogue.dlg_vulcan_hub.confirm_paladin.choice.back_from_paladin: "I want to see other classes"
ec.content.dialogue.dlg_vulcan_hub.confirm_cleric.text: "A Star Guide! A reliable support healer who never lets healing and defensive blessings run dry with abundant mana, holding the line with starlight and thunder. Nobody beats you in a long fight. Is this the one?"
ec.content.dialogue.dlg_vulcan_hub.confirm_cleric.choice.choose_cleric: "I'll be a Star Guide!"
ec.content.dialogue.dlg_vulcan_hub.confirm_cleric.choice.back_from_cleric: "I want to see other classes"
ec.content.dialogue.dlg_vulcan_hub.confirm_assassin.text: "A shadowblade! The top-tier critical attacker who builds \"Focus\" and unleashes rapid void and ice blades. Slash your enemies to ribbons with razor-thin dodges. Is this the one?"
ec.content.dialogue.dlg_vulcan_hub.confirm_assassin.choice.choose_assassin: "I'll be a Shadowblade!"
ec.content.dialogue.dlg_vulcan_hub.confirm_assassin.choice.back_from_assassin: "I want to see other classes"
ec.content.dialogue.dlg_vulcan_hub.class_done.text: "Good, it's settled! Now go greet Garudo the blacksmith. When you come back, I'll hand you your first job, partner!"
ec.content.dialogue.dlg_vulcan_hub.m01_done.text: "Hahaha! Good face on you, partner! All right, take your starting gear and healing potions. Time for your first job. The north gate bell is ringing; something's off in the forest."
ec.content.dialogue.dlg_vulcan_hub.m01_done.choice.accept_m02_now: "Head to the forest right away (Strange Changes in the Forest and First Battle - Accept)"
ec.content.dialogue.dlg_vulcan_hub.m01_done.choice.prep_first: "I'll prepare a bit, then come accept it"
ec.content.dialogue.dlg_vulcan_hub.m02_started.text: "Monsters have apparently gone suddenly violent in Ashwood Forest, just outside the north gate. Ranger Captain Elena is holding out on site. Clear the slimes and wolves on the road and join her!"
ec.content.dialogue.dlg_vulcan_hub.m03_done.text: "...Hm, so a black wedge was driven into the starshard. No doubt, it's the Hollow Hand folks from the rumors! I respect your judgment. Next is the northeastern Weeping Mine, where readings close to their base have appeared!"
ec.content.dialogue.dlg_vulcan_hub.m04_started.text: "The Weeping Mine is an old mine closed ten years ago, but recently its mana readings have been unusually dense. Join Supply Officer Tomas and Miner Chief Daren at the entrance camp and investigate the anomaly inside."
ec.content.dialogue.dlg_vulcan_hub.s03_started.text: "Thorn Wolves and Moss Goblins attacked a merchant's wagon on the forest road. Thin out their numbers before the damage spreads any further!"
ec.content.dialogue.dlg_vulcan_hub.s03_done.text: "Good, the highway is secure! This is a fine weapon I had Garudo make. Take one that suits your class!"
ec.content.dialogue.dlg_vulcan_hub.s09_done.text: "It was a harsh decision, but you did splendid work upholding discipline. I'll put the recovered supplies and testimony to use defending Lumina. Here's a special guild appraisal reward. Take it!"
ec.content.dialogue.dlg_vulcan_hub.s11_started.text: "On Stargazer Hill the Hollow Hand folks are still stubbornly moving around. We need to whittle down their forces a little each day. Can you handle the sweep?"
ec.content.dialogue.dlg_vulcan_hub.s11_done.text: "Excellent work, partner! Here's today's hunting reward and Purified Starshards. I'm counting on you again tomorrow!"
ec.content.dialogue.dlg_vulcan_hub.ending_choice3.text: "...So this is the \"Void Core Remnant\" left at the sanctuary's depths. Kain's mention of the \"second Starshard\" worries me, but we must decide where this powerful crystal belongs. Lady Lyra asks me to entrust it to analyzing the second Starshard, while I'd like to seal it tightly in the vault as Lumina Port's defense barrier. ...Partner who brought it back risking life and limb, you decide."
ec.content.dialogue.dlg_vulcan_hub.ending_choice3.choice.choose_guild_seal: "Seal it tightly in the Lumina Port guild vault (strengthen Lumina's defenses)"
ec.content.dialogue.dlg_vulcan_hub.ending_choice3.choice.choose_observatory_research: "Entrust the research to Stargazer Sage Lyra (analyze the location of the second Starshard)"
ec.content.dialogue.dlg_vulcan_hub.ending_guild.text: "...All right, received! With you and me, we'll protect Lumina Port without fail. I bestow upon you the title \"Shield of Lumina.\" When we next expedition to the Azure Frostpeaks in the north, I'll leave the vanguard to you, partner!"
ec.content.dialogue.dlg_vulcan_hub.ending_observatory.text: "Ha, you entrusted it to Lady Lyra! They say her starmap has already caught the pulse of the Azure Frostpeaks. Take the title \"Guide of Stars\" and the exchange's preferential rights. Once the path is visible, all that's left is preparation, so hone your skills, partner!"
ec.content.dialogue.dlg_vulcan_hub.post_ch1.text: "You did it, partner! Lumina Port was saved thanks to you. To prepare for the journey to the Azure Frostpeaks in the north, gear up by sweeping the remnants on Stargazer Hill and running the sanctum!"
ec.content.dialogue.dlg_vulcan_hub.post_ch1.choice.post_s11_start: "Accept \"Purging the Black Shadows\" (repeatable quest)"
ec.content.dialogue.dlg_vulcan_hub.post_ch1.choice.post_s11_done: "Report \"Purging the Black Shadows\""
ec.content.dialogue.dlg_vulcan_hub.post_ch1.choice.post_s09_done: "Submit the supply corps audit report"
ec.content.dialogue.dlg_vulcan_hub.post_ch1.choice.post_bye: "See you, Guildmaster"
