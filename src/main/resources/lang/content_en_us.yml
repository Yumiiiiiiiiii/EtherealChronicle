ec.content.gathering.node_ridge_frostbloom.name: "Frostflower Herb"
ec.content.gathering.node_ridge_wood.name: "Frozen Starwood Ancient Tree"
ec.content.gathering.node_sanctum_crystal.name: "Void Core Crystal Vein"
ec.content.item.item_acc_alpha_fang_talisman.name: "Beastking's Starfang Talisman"
ec.content.item.item_acc_alpha_fang_talisman.lore: "Proof of defeating Alpha, the Beastking of the Ashen Forest, in the Novice Trial Arena. The sharp star fang boosts attack power and crit rate."
ec.content.item.item_acc_azure_core_signet.name: "Azure Ice Core Signet Ring"
ec.content.item.item_acc_azure_core_signet.lore: "Proof of a hero who conquered the Azure Ice Citadel. [Azure Ice Blessing] A barrier of absolute zero wraps its bearer and holds their life together against fatal blows."
ec.content.item.item_acc_crucible_champion_crest.name: "Trial Champion's Starcore Crest"
ec.content.item.item_acc_crucible_champion_crest.lore: "Proof of a champion who defeated the Aether Chimera, Fusion of Starcores. [Starcore Resonance] On attack, triggers a starlight follow-up strike and a defensive barrier."
ec.content.item.item_acc_forest_ward_charm.name: "Forest Spirit Charm"
ec.content.item.item_acc_forest_ward_charm.lore: "A green crystal that fell from the starshard purified and returned to the earth. [Breath of the Forest] Quietly heals the wounds of those who befriended the forest."
ec.content.item.item_acc_frostbreaker_signet.name: "Icebreaker's War Seal"
ec.content.item.item_acc_frostbreaker_signet.lore: "A war seal entrusted by Seraphina when you overheat-destroyed the cult's cooling network. [Icebreaking Flash] Sends sharp ice-shattering shocks in response to your attacks."
ec.content.item.item_acc_glacier_ward_pendant.name: "Frostpeak Guardian Pendant"
ec.content.item.item_acc_glacier_ward_pendant.lore: "A talisman Orphe gave as proof you stabilized the starshard conduit at low temperature. [Azure Ice Stillness] A gentle ice barrier softens lethal cold."
ec.content.item.item_acc_rookie_charm.name: "Apprentice Adventurer's Star Charm"
ec.content.item.item_acc_rookie_charm.lore: "A starshard charm given to apprentices who excelled on Lumina Port's quest board. Ideal for your first +1 to +3 enhancements."
ec.content.item.item_acc_starshard_crest.name: "Starshard War Crest"
ec.content.item.item_acc_starshard_crest.lore: "A war crest made from the forest starshard sealed in a magic vessel. [Starshard Overload] A faintly pulsing light stirs its bearer's fighting spirit and attack power."
ec.content.item.item_acc_veteran_emblem.name: "Azure Veteran Adventurer's Insignia"
ec.content.item.item_acc_veteran_emblem.lore: "An honored insignia awarded to veteran adventurers who raced through the starshards and Frostpeaks. [Veteran's Breath] Brings gentle recovery during combat."
ec.content.item.item_acc_void_heart_ring.name: "Void Core Sealing Ring"
ec.content.item.item_acc_void_heart_ring.lore: "Proof of conquering the Void Sanctum. [Defiance of the Void] Repels the void's erosion and holds the bearer's life together in a pinch."
ec.content.item.item_arm_artisan_greaves.name: "Masterforged Starsteel Greaves"
ec.content.item.item_arm_artisan_greaves.lore: "Custom greaves that crystallize Borka's and Kaede's skills. [Stalwart Legs Stance] Generates a defensive barrier that deflects the impact of mighty foes."
ec.content.item.item_arm_ashwood_boots.name: "Ashwood Light Boots"
ec.content.item.item_arm_ashwood_boots.lore: "Boots treated so you won't slip on damp moss or thorns. Handy for crossing the forest."
ec.content.item.item_arm_assassin_shroud.name: "Shadowblade Order's Black Night Garb"
ec.content.item.item_arm_assassin_shroud.lore: "Stealth garb tailored from a special fiber that absorbs light. [Shadow Cloak] A thin shadow protects you when danger is sensed."
ec.content.item.item_arm_cleric_vestment.name: "Star Guide Choir Vestment"
ec.content.item.item_arm_cleric_vestment.lore: "Ceremonial vestments woven with the azure holy crest. [Starreader's Blessing] In a crisis, a soft healing light wraps around you."
ec.content.item.item_arm_cryomancer_mantle.name: "Frostpeak Starcaster's Robe"
ec.content.item.item_arm_cryomancer_mantle.lore: "A starcaster's ceremonial wear woven with azure resonance crests. [Frost Veil Guard] Spreads a thin ice barrier around you to protect the mage."
ec.content.item.item_arm_frostguard_cuirass.name: "Frostiron Guardian Heavy Cuirass"
ec.content.item.item_arm_frostguard_cuirass.lore: "Heavy armor reforged from the Frost Colossus's frostiron plating. [Frostiron Stance] Absorbs fierce blows with a crystalline ice barrier."
ec.content.item.item_arm_frostpeak_helm.name: "Frostpeak Cold-Ward Helm"
ec.content.item.item_arm_frostpeak_helm.lore: "A cold-weather helm of the smith Borka's pride, lined with Rime Wolf fur. Keeps your aim steady even in blizzard visibility."
ec.content.item.item_arm_glacier_treads.name: "Azure Ice Trekker's Greaves"
ec.content.item.item_arm_glacier_treads.lore: "Heavy greaves with claw irons for firm steps even on ice. They block the cold and keep your footwork light."
ec.content.item.item_arm_lumina_helm.name: "Lumina Apprentice's Helm"
ec.content.item.item_arm_lumina_helm.lore: "A light helm engraved with the Lumina Port Guild crest. Wide field of view, easy for any class to use."
ec.content.item.item_arm_miner_greaves.name: "Miner's Reinforced Greaves"
ec.content.item.item_arm_miner_greaves.lore: "Sturdy greaves with iron plates to protect the legs from falling rocks. Their weight helps you plant your feet."
ec.content.item.item_arm_paladin_plate.name: "Azure Paladin's Heavy Armor"
ec.content.item.item_arm_paladin_plate.lore: "Heavy-plated paladin armor engraved with star crests. [Unshakable Oath] Wraps you in an unwavering bulwark even through fierce combos."
ec.content.item.item_arm_ranger_jerkin.name: "Stargazer Ranger's Cloak"
ec.content.item.item_arm_ranger_jerkin.lore: "A light cloak tailored in Elena's style with stargazer cloth. [Hunter's Insight] Sees through danger and recovers your focus."
ec.content.item.item_arm_sage_robe.name: "Stargazer Sage's Robe"
ec.content.item.item_arm_sage_robe.lore: "A robe woven from starshard thread by the observatory's weaver. [Starveil Ward] Softly deflects the void's miasma."
ec.content.item.item_arm_snowstalker_coat.name: "Snowfield Hunter's Coat"
ec.content.item.item_arm_snowstalker_coat.lore: "A hunter's coat tailored from silver cold-weather cloth and frost-crystal thread. [Breath of Deep Cold] Keeps your breathing steady and restores focus even in freezing air."
ec.content.item.item_arm_vanguard_plate.name: "Dawnlight Knight's Cuirass"
ec.content.item.item_arm_vanguard_plate.lore: "Silver heavy armor symbolizing the dawn of Lumina Port. [Indomitable Pulse] In a pinch, deploys a silver barrier to support the front line."
ec.content.item.item_bait_aether_lure.name: "Starshard Lure"
ec.content.item.item_bait_aether_lure.lore: "A special lure that emits faint starshard light. Highly effective at attracting nighttime fantasy fish and rare species."
ec.content.item.item_bait_dew_grub.name: "Morning Dew Worm"
ec.content.item.item_bait_dew_grub.lore: "Stream fishing bait scented with morning dew moss and amber sap. Makes freshwater, forest fish, and twilight rare fish more likely to bite."
ec.content.item.item_bait_earthworm.name: "Azure Worm"
ec.content.item.item_bait_earthworm.lore: "A standard bait that bites well at the port and forest streams. Shortens the wait for a bite and improves freshwater fish bite rates."
ec.content.item.item_bait_frost_krill.name: "Frost Krill"
ec.content.item.item_bait_frost_krill.lore: "Premium cold bait harvested from azure frost seas. Lures rare big fish like Blizzard Sharks and Abyss Anglers."
ec.content.item.item_con_aether_crystal_tonic.name: "Azure Crystal Mana Tonic"
ec.content.item.item_con_aether_crystal_tonic.lore: "A tonic dissolved with high-purity ice crystal aether. Restores 55 resource and purges poison and slow."
ec.content.item.item_con_amber_koi_glaze.name: "Amber Carp Teriyaki"
ec.content.item.item_con_amber_koi_glaze.lore: "A superb dish of the legendary Amber Nishikigoi grilled to savory perfection. Restores 135 HP and raises defense by 12."
ec.content.item.item_con_antidote_herb.name: "Antidote Herb"
ec.content.item.item_con_antidote_herb.lore: "A refreshing forest herb. Instantly cures status ailments such as poison, spores, and void corrosion."
ec.content.item.item_con_frost_seafood_pot.name: "Azure Ice Seafood Star Hotpot"
ec.content.item.item_con_frost_seafood_pot.lore: "A frigid star hotpot simmered from Frostice Smelt and Frostflower herbs. Restores 640 HP and grants +18 defense for 15 seconds (10-second reuse)."
ec.content.item.item_con_frostguard_brew.name: "Frostpeak Cold-Ward Elixir"
ec.content.item.item_con_frostguard_brew.lore: "A cold-resistance restorative brewed from northern herbs and ice crystal dew. Restores 680 HP and briefly raises defense."
ec.content.item.item_con_glacier_feast.name: "Frostpeak Warm-Smoked Salmon Dish"
ec.content.item.item_con_glacier_feast.lore: "An exquisite dish grilled at the hearth by the smith Borka. Restores 520 HP and grants a strong defense buff."
ec.content.item.item_con_goby_fritter.name: "Herb-Fried Harbor Goby"
ec.content.item.item_con_goby_fritter.lore: "A harbor town specialty snack of freshly caught Harbor Goby fried crispy. Restores 55 HP."
ec.content.item.item_con_greater_hp_potion.name: "Greater Healing Potion"
ec.content.item.item_con_greater_hp_potion.lore: "A bright crimson elixir mixed with a few drops of starshard. Instantly restores 560 HP."
ec.content.item.item_con_loach_broth.name: "Moss Loach and Morning Dew Moss Nourishing Broth"
ec.content.item.item_con_loach_broth.lore: "A warm soup simmered slowly with Moss Loach and Morning Dew Moss. Restores 70 HP and 22 resource."
ec.content.item.item_con_lumina_stew.name: "Lumina Port Seafood Stew"
ec.content.item.item_con_lumina_stew.lore: "A warm seafood stew, Lumina Port's specialty. Heals your body and gives you reassuring vitality for about 15 minutes."
ec.content.item.item_con_medium_hp_potion.name: "Intermediate Healing Potion"
ec.content.item.item_con_medium_hp_potion.lore: "A deep crimson healing potion concentrated from high-purity herb extract. Instantly restores 280 HP."
ec.content.item.item_con_miner_ration.name: "Miner's Stamina Grilled Meat"
ec.content.item.item_con_miner_ration.lore: "A spice-laden grilled meat beloved at the mine's camp. Grants sturdy defense and stamina for 15 minutes."
ec.content.item.item_con_minor_hp_potion.name: "Minor Healing Potion"
ec.content.item.item_con_minor_hp_potion.lore: "A red liquid brewed by the herbalist Mira. Instantly restores 110 HP when drunk."
ec.content.item.item_con_moon_carp_sashimi.name: "Moonshadow Carp Starlight Sashimi"
ec.content.item.item_con_moon_carp_sashimi.lore: "A fine dish of fresh Moonshadow Carp sliced thin. Restores 70 resource and purifies poison and slow (9-second reuse)."
ec.content.item.item_con_moondew_draught.name: "Moondew and Resin Elixir"
ec.content.item.item_con_moondew_draught.lore: "An elixir blending Moondew spirit herb and starwood resin. Restores 460 HP and 45 resource and heals poison and slow (9-second reuse)."
ec.content.item.item_con_resource_elixir.name: "Aether Elixir"
ec.content.item.item_con_resource_elixir.lore: "A clear blue mana drink. Instantly restores a large amount of Rage, Focus, or Mana."
ec.content.item.item_con_return_scroll.name: "Lumina Return Scroll"
ec.content.item.item_con_return_scroll.lore: "Magic paper that resonates with the Lumina Port return monolith. When used, you instantly return to the safe harbor town."
ec.content.item.item_con_revive_feather.name: "Phoenix Starfeather"
ec.content.item.item_con_revive_feather.lore: "An ornament with a pale golden glow. When equipped, it prevents lethal damage once and greatly restores your vitality."
ec.content.item.item_con_sardine_skewers.name: "Silverscale Sardine Salt Skewers"
ec.content.item.item_con_sardine_skewers.lore: "A specialty of Lumina Port's pier. Restores 220 HP with savory grilled Silverscale Sardine (6-second reuse)."
ec.content.item.item_con_sky_salmon_grill.name: "Herb-Grilled Azure Salmon"
ec.content.item.item_con_sky_salmon_grill.lore: "A fisherman's dish of fresh Azure Salmon grilled with herbs. Restores 380 HP and 35 resource."
ec.content.item.item_con_starlight_elixir.name: "Supreme Stardew Elixir"
ec.content.item.item_con_starlight_elixir.lore: "An elixir refined from Stardew Lotus. Restores 520 HP and 75 resource at once."
ec.content.item.item_con_starlight_tea.name: "Stargazer Herbal Tea"
ec.content.item.item_con_starlight_tea.lore: "A fragrant tea brewed from night-glow herbs blooming on Stargazer Hill. Sharpens the mind and supports focus and mana circulation in long fights."
ec.content.item.item_con_trout_herb_soup.name: "Trout and Herb Warm Soup"
ec.content.item.item_con_trout_herb_soup.lore: "A nourishing soup of Sunbeam Trout and Ash Leaf. Restores 320 HP and 35 resource at once (8-second reuse)."
ec.content.item.item_con_whetstone_tonic.name: "Sturdy Blade Guard Polishing Elixir"
ec.content.item.item_con_whetstone_tonic.lore: "A battlefield tonic dissolving artisan whetstone powder in spirit water. Raises defense by 24 for a short time."
ec.content.item.item_fish_abyssal_angler.name: "Abyss Angler"
ec.content.item.item_fish_abyssal_angler.lore: "A glowing anglerfish living in the Azure Crystal Cavern's abyss pool. A formidable catch for Frost Krill and a high-tier rod, traded at a high price (approx. length 65-150 cm)."
ec.content.item.item_fish_amber_koi.name: "Amber Nishikigoi"
ec.content.item.item_fish_amber_koi.lore: "A legendary nishikigoi that shows itself only at twilight and night in Ashwood's clear streams where amber sap dissolves. Landing one makes for a top early-game tale."
ec.content.item.item_fish_blizzard_shark.name: "Blizzard Shark"
ec.content.item.item_fish_blizzard_shark.lore: "A ferocious ice shark that appears in Rime Ridge's fractured ice lake in bad weather. A prize for veterans who can ride out its violent dives (approx. length 90-210 cm)."
ec.content.item.item_fish_celestial_oarfish.name: "Azure Dragonfish"
ec.content.item.item_fish_celestial_oarfish.lore: "A legendary long fish said to appear in the deepest part of the Stargazer Spring. Boasts a ferocious pull that only the Starcore Great Rod can withstand (approx. length 180-420 cm)."
ec.content.item.item_fish_dawn_minnow.name: "Dawnglow Dace"
ec.content.item.item_fish_dawn_minnow.lore: "A vermilion stream fish that surfaces only at dawn and dusk twilight. Rarely caught at both Lumina Port and Ashwood Forest."
ec.content.item.item_fish_glacier_smelt.name: "Frostice Smelt"
ec.content.item.item_fish_glacier_smelt.lore: "A translucent ice fish caught in the ice holes of the Azure Frost Outpost. Rich in fat and essential for the frigid star hotpot (approx. length 12-30 cm)."
ec.content.item.item_fish_harbor_goby.name: "Harbor Goby"
ec.content.item.item_fish_harbor_goby.lore: "A small fish schooling around the stonework of Lumina Port. Easy for beginners to catch, and delicious fried with herbs."
ec.content.item.item_fish_iron_catfish.name: "Iron-Scale Catfish"
ec.content.item.item_fish_iron_catfish.lore: "A hard-scaled catfish lurking in the Weeping Mine's underground waterways. Heavy pull that tests your tension management during its thrashing (approx. length 40-95 cm)."
ec.content.item.item_fish_milkyway_dace.name: "Milky Way Fish"
ec.content.item.item_fish_milkyway_dace.lore: "A fantasy fish that bites Starshard Lures only at night in the Stargazer Spring. Its scales faintly flicker like stardust (approx. length 30-75 cm)."
ec.content.item.item_fish_moon_carp.name: "Moonshadow Carp"
ec.content.item.item_fish_moon_carp.lore: "A pale blue carp that shows itself only in the forest's clear streams at night. Prepared as starlight sashimi, it clears mana and status ailments (approx. length 45-105 cm)."
ec.content.item.item_fish_moss_loach.name: "Moss Loach"
ec.content.item.item_fish_moss_loach.lore: "A striped loach living on the bottom of Ashwood Forest's clear streams. Simmered with Morning Dew Moss, it warms you to the core."
ec.content.item.item_fish_rain_eel.name: "Rainy Night Eel"
ec.content.item.item_fish_rain_eel.lore: "A glossy eel that crawls into Ashwood's clear streams and the mine's waterways only on rainy or stormy nights. The dream catch of seasoned apprentice anglers."
ec.content.item.item_fish_silver_sardine.name: "Silverscale Sardine"
ec.content.item.item_fish_silver_sardine.lore: "A small fish schooling at Lumina Port's pier. Prized as an ingredient for salt skewers and a staple guild delivery (approx. length 15-38 cm)."
ec.content.item.item_fish_sunbeam_trout.name: "Sunbeam Trout"
ec.content.item.item_fish_sunbeam_trout.lore: "A pale green patterned stream fish living in Ashwood Forest's clear streams. Simmered with herbs, it becomes a nourishing warm soup (approx. length 22-52 cm)."
ec.content.item.item_mat_aether_crystal_core.name: "Azure Crystal Core"
ec.content.item.item_mat_aether_crystal_core.lore: "A high-purity crystal core obtainable only from starshard crystal nodes with an extractor. The key treasure material for the Starcore Azure Great Rod."
ec.content.item.item_mat_aether_gel.name: "Aether Jelly"
ec.content.item.item_mat_aether_gel.lore: "A transparent gel taken from Aether Slimes. Popular as a herbal brewing ingredient."
ec.content.item.item_mat_alpha_fang.name: "Beastking's Star Fang"
ec.content.item.item_mat_alpha_fang.lore: "Proof of defeating Alpha, the Beastking of the Ashen Forest, in the Novice Trial Arena. Can be exchanged for talismans and polishing whetstones with Instructor Rook."
ec.content.item.item_mat_amber_sap.name: "Forest Amber Sap"
ec.content.item.item_mat_amber_sap.lore: "Rich sap oozing from the Amber Starwood. Used as a coating for the Willow Precision Beginner Rod and in brewing special bait."
ec.content.item.item_mat_artisan_whetstone.name: "Artisan's Polishing Whetstone"
ec.content.item.item_mat_artisan_whetstone.lore: "A special whetstone of fired scrap iron and thunder crystal. Used at Kaede's workshop to forge and enhance gear."
ec.content.item.item_mat_ash_leaf.name: "Ash Leaf"
ec.content.item.item_mat_ash_leaf.lore: "A fragrant herb growing wild in Ashwood Forest. Can be gathered with a silver sickle and is a material for warm soups and higher-grade herb sickles."
ec.content.item.item_mat_azure_gem_ore.name: "Raw Azure Gem"
ec.content.item.item_mat_azure_gem_ore.lore: "Blue gem stone pulsing in deep veins. A rare ore used to refine Artisan's Polishing Whetstones and craft Starshard Lures."
ec.content.item.item_mat_chronicle_seal.name: "Adventurer Guild Merit Seal"
ec.content.item.item_mat_chronicle_seal.lore: "Proof of completing daily and weekly quests. Exchangeable for gear and consumables at Ren's merit exchange."
ec.content.item.item_mat_crucible_medal.name: "Starshard Trial Medal"
ec.content.item.item_mat_crucible_medal.lore: "Proof of conquering the Starshard Proving Grounds. Exchangeable for top-tier gear and insignia at Kaede's workshop."
ec.content.item.item_mat_cryo_crystal.name: "Frost Crystal Fragment"
ec.content.item.item_mat_cryo_crystal.lore: "A mineral crystal condensed from the cold filling the Azure Frostpeaks. Conducts mana stably even at low temperatures."
ec.content.item.item_mat_dew_moss.name: "Morning Dew Moss"
ec.content.item.item_mat_dew_moss.lore: "Soft moss that stored morning dew in the shade of Ashwood Forest. Handy as a broth ingredient and for making Morning Dew Worm bait."
ec.content.item.item_mat_frost_pelt.name: "Rime Wolf Pelt"
ec.content.item.item_mat_frost_pelt.lore: "Thick pelt of wolves that roam the freezing Frostpeaks. Used for cold-weather gear lining and as airship relay light insulation."
ec.content.item.item_mat_frostbloom_herb.name: "Frostflower Herb"
ec.content.item.item_mat_frostbloom_herb.lore: "A blue flowering herb blooming in Rime Ridge's extreme cold. Can be picked with a higher-grade herb sickle and flavors the Azure Ice Seafood Star Hotpot."
ec.content.item.item_mat_glacial_core_essence.name: "Ice Core Essence"
ec.content.item.item_mat_glacial_core_essence.lore: "A pure ice core extracted from Cryo Archon. The key to forging legendary gear symbolizing the Azure Frostpeaks."
ec.content.item.item_mat_glacial_shard.name: "Azure Frost Shard"
ec.content.item.item_mat_glacial_shard.lore: "A pure ice crystal fragment spilled from the second Starshard. Exchangeable for Frostpeak gear with the smith Borka."
ec.content.item.item_mat_hermit_scroll.name: "Ancient Tree Record Fragment"
ec.content.item.item_mat_hermit_scroll.lore: "Ecological notes written by Baldo, who lives in seclusion deep in Ashwood Forest. Records the weather rare fish prefer and the history of the ancient trees."
ec.content.item.item_mat_iron_scrap.name: "Mine Old Iron Scrap"
ec.content.item.item_mat_iron_scrap.lore: "High-purity old iron scraps left in the Weeping Mine. Fine material that makes Garudo the blacksmith's eyes light up."
ec.content.item.item_mat_moondew_herb.name: "Moondew Spirit Herb"
ec.content.item.item_mat_moondew_herb.lore: "A spirit herb holding night dew, rarely gathered on Stargazer Hill and Rime Ridge. The main component of advanced healing elixirs."
ec.content.item.item_mat_moss_hide.name: "Mossy Hide"
ec.content.item.item_mat_moss_hide.lore: "A thick hide stained deep green by the forest's humidity. Peddler Pip likes to buy it."
ec.content.item.item_mat_river_pebble_ore.name: "Riverbed Starsteel Pebble"
ec.content.item.item_mat_river_pebble_ore.lore: "Fine starsteel pebbles mixed into the west shore of Lumina Port and Ashwood's surface veins. Material for early delivery quests and whetstone refining."
ec.content.item.item_mat_rookie_crest.name: "Azure Apprentice Badge"
ec.content.item.item_mat_rookie_crest.lore: "A token for completing Lumina Port guild board quests. Exchangeable for gear and polishing whetstones at Leila's and Rook's counters."
ec.content.item.item_mat_sky_salmon.name: "Azure Salmon"
ec.content.item.item_mat_sky_salmon.lore: "A silver-scaled migratory fish landed from Lumina Port's clear waters. Highly popular as an artisan's cooking ingredient."
ec.content.item.item_mat_spark_crystal.name: "Charged Crystal"
ec.content.item.item_mat_spark_crystal.lore: "A pale blue crystal shard that sends a faint shock when touched. Carried by the mine's charged bats."
ec.content.item.item_mat_star_bark.name: "Starblighted Bark"
ec.content.item.item_mat_star_bark.lore: "Rare bark with azure-violet starshard crystal running through it like veins. A spoil from defeating a mighty foe of the forest."
ec.content.item.item_mat_stariron_ore.name: "Starsteel Ore"
ec.content.item.item_mat_stariron_ore.lore: "Quality raw starsteel mined from the Weeping Mine's veins. Material for higher-grade mining tools and whetstone refining."
ec.content.item.item_mat_starlight_lotus.name: "Stardew Lotus"
ec.content.item.item_mat_starlight_lotus.lore: "A pale blue herb blooming on starshard mana. Essential for brewing elixirs."
ec.content.item.item_mat_starshard_fragment.name: "Purified Starshard"
ec.content.item.item_mat_starshard_fragment.lore: "A starshard fragment cleansed of impure miasma. Exchangeable for rare gear at Sage Lyra's or Tomas's exchange."
ec.content.item.item_mat_starwood_log.name: "Starwood Log"
ec.content.item.item_mat_starwood_log.lore: "Supple old timber that has faintly absorbed starlight. Can be felled with a hatchet and prized as shaft material for the Starwood Precision Rod."
ec.content.item.item_mat_starwood_resin.name: "Starwood Resin"
ec.content.item.item_mat_starwood_resin.lore: "Golden sap rarely obtained when felling starwood. Used in brewing elixirs and as an adhesive for Starshard Lures."
ec.content.item.item_mat_thorn_fang.name: "Thorn Fang"
ec.content.item.item_mat_thorn_fang.lore: "A sharp, thorn-like canine of a Thorn Wolf. Fetches a steady price when sold to shops."
ec.content.item.item_mat_venom_gland.name: "Spore Venom Gland"
ec.content.item.item_mat_venom_gland.lore: "A venom sac extracted from a Spore Spider. Traded at a high price as a premium alchemy ingredient."
ec.content.item.item_mat_void_core_essence.name: "Void Core Essence"
ec.content.item.item_mat_void_core_essence.lore: "A dense crystal core extracted from the Void Core Guardian. The key to weaving legendary gear with Sage Lyra."
ec.content.item.item_mat_void_dust.name: "Void Dust"
ec.content.item.item_mat_void_dust.lore: "Purple-black fine particles left by the dark cult Hollow Hand's sorcery. Also research material on Stargazer Hill."
ec.content.item.item_mat_whetstone_shard.name: "Rough Whetstone Fragment"
ec.content.item.item_mat_whetstone_shard.lore: "A hard whetstone chip from the port and Ashwood veins. Can be refined into an Artisan's Polishing Whetstone at Leila's counter together with riverbed starsteel pebbles."
ec.content.item.item_off_astral_tome.name: "Astral Reading Grimoire"
ec.content.item.item_off_astral_tome.lore: "A grimoire with star charts drawn in silver ink. [Mana Recirculation] The star chart replenishes mana when you're nearly drained."
ec.content.item.item_off_astral_tower_shield.name: "Starlight Great Tower Shield \"Bastion\""
ec.content.item.item_off_astral_tower_shield.lore: "A huge tower shield layering starshard and azure ice steel. [Star Wall Guard] Re-erects a holy light barrier each time you take an impact."
ec.content.item.item_off_cryo_grimoire.name: "Azure Ice Star Chart Grimoire"
ec.content.item.item_off_cryo_grimoire.lore: "A copy of ancient cooling spellwork taken out by Seraphina. [Ice Flow Circulation] Recovers mana from the aftermath of casting."
ec.content.item.item_off_frostguard_bulwark.name: "Frostiron Great Shield"
ec.content.item.item_off_frostguard_bulwark.lore: "A heavy shield forged from frostiron steel taken from the cavern sentinel. [Ice Wall Deployment] Re-erects a frost barrier the moment you take an attack."
ec.content.item.item_off_glacier_quiver.name: "Azure Ice Feather Arrow Bundle"
ec.content.item.item_off_glacier_quiver.lore: "A special arrow bundle of azure ice crystal arrowheads. [Frost-Burst Follow-up] Scatters ice crystal shards in response to rapid fire."
ec.content.item.item_off_iron_kite_shield.name: "Iron-Rimmed Knight's Great Shield"
ec.content.item.item_off_iron_kite_shield.lore: "A tall knight's shield mass-produced at the port's smithy. A linchpin of the Paladin's playstyle."
ec.content.item.item_off_leather_quiver.name: "Leather Quiver"
ec.content.item.item_off_leather_quiver.lore: "A sturdy leather quiver slung diagonally at the waist. Its mouth is cut at an angle so you can nock the next arrow quickly."
ec.content.item.item_off_oak_buckler.name: "Oak Buckler"
ec.content.item.item_off_oak_buckler.lore: "A lightweight round shield rimmed with an iron ring. Enough to stop a wolf's charge."
ec.content.item.item_off_obsidian_aegis.name: "Obsidian Bulwark Shield"
ec.content.item.item_off_obsidian_aegis.lore: "A great shield reforged from Obsidian Golem armor plating. [Echoing Guard] Draws aggro and raises defense when defending, a pillar of co-op play."
ec.content.item.item_off_parrying_dagger.name: "Parrying Shadow Dagger"
ec.content.item.item_off_parrying_dagger.lore: "A small parrying dagger held reverse-grip in the left hand. Creates openings for counterattacks."
ec.content.item.item_off_prayer_rosary.name: "Starsilver Prayer Rosary"
ec.content.item.item_off_prayer_rosary.lore: "A small rosary sealing drops of starlight. Helps the Star Guide's concentration."
ec.content.item.item_off_sanctified_chalice.name: "Consecrated Stardew Chalice \"Luminus\""
ec.content.item.item_off_sanctified_chalice.lore: "A golden chalice brimming with endless stardew. [Blessing of the Star Spring] Steadily restores mana and health during combat."
ec.content.item.item_off_shadow_smoke_vial.name: "Phantom Mist Assassin's Vial \"Mirage\""
ec.content.item.item_off_shadow_smoke_vial.lore: "A secret vial that sealed void mist. [Mirage Follow-up Blade] Under cover of smoke, produces a void strike and an evasion barrier."
ec.content.item.item_off_windrunner_quiver.name: "Gale Starfeather Quiver"
ec.content.item.item_off_windrunner_quiver.lore: "A quiver woven from feathers wrapped in aether wind. [Tailwind Footwork] Launches sharp follow-ups along with nimble footwork."
ec.content.item.item_off_worn_grimoire.name: "Worn Grimoire"
ec.content.item.item_off_worn_grimoire.lore: "A primer with basic fire, ice, and lightning incantations written in it. Previous owners' scribbles remain in the margins."
ec.content.item.item_q_azure_core_remnant.name: "Azure Ice Core Remnant"
ec.content.item.item_q_azure_core_remnant.lore: "A purified crystal of the \"second Starshard\" left after repelling Cryo Archon. Emits a quiet blue light."
ec.content.item.item_q_cult_frost_cipher.name: "Cult Frostpeak Cipher Table"
ec.content.item.item_q_cult_frost_cipher.lore: "A coded order carried by the Hollow Hand's Frost Mages. Records the cavern's sealing procedures and supply routes."
ec.content.item.item_q_cult_letter.name: "Hollow Hand Secret Letter"
ec.content.item.item_q_cult_letter.lore: "A cult letter closed with black wax. Records a deal with Miner Chief Daren."
ec.content.item.item_q_forest_starshard.name: "Rampaging Forest Starshard"
ec.content.item.item_q_forest_starshard.lore: "The azure-violet starshard that served as the Starblighted Treant's core. Keeps pulsing unstably."
ec.content.item.item_q_frozen_seal_key.name: "Azure Ice Citadel Frozen Seal Key"
ec.content.item.item_q_frozen_seal_key.lore: "An ancient ice-steel key held in the Frost Colossus's furnace core. Breaks the main gate seal of the Azure Ice Citadel."
ec.content.item.item_q_guild_badge.name: "Lumina Apprentice Adventurer's Pass"
ec.content.item.item_q_guild_badge.lore: "A copper badge showing official registration with the Lumina Port Adventurers' Guild."
ec.content.item.item_q_mine_seal_key.name: "Shaft 3 Seal Key"
ec.content.item.item_q_mine_seal_key.lore: "A heavy iron key that opens the mechanical furnace of the Weeping Mine's Shaft 3."
ec.content.item.item_q_sealed_diary.name: "Sealed Survey Journal"
ec.content.item.item_q_sealed_diary.lore: "The notes of the predecessor expedition taken by cultists. Contains passages hinting at the truth of the starshard crash."
ec.content.item.item_q_star_astrolabe.name: "Ancient Astrolabe"
ec.content.item.item_q_star_astrolabe.lore: "An ancient star chart disc for activating the sealed gate of Stargazer Hill."
ec.content.item.item_q_void_remnant.name: "Void Core Remnant"
ec.content.item.item_q_void_remnant.lore: "A clear crystal core left on the altar after defeating the Void Warden. It holds Lumina's future in the balance."
ec.content.item.item_tool_extractor_aether.name: "Starshard Crystal Extractor"
ec.content.item.item_tool_extractor_aether.lore: "A precision instrument that resonantly extracts mana cores from starshard crystal nodes. Required for gathering crystals on Stargazer Hill and in the ice cavern (Rank 1)."
ec.content.item.item_tool_hatchet_iron.name: "Woodcutter's Starwood Hatchet"
ec.content.item.item_tool_hatchet_iron.lore: "A gathering hatchet for safely felling starwood logs and driftwood nodes. Rarely also yields fragrant starwood resin (Rank 1)."
ec.content.item.item_tool_pick_astral.name: "Azure Starshine Pickaxe"
ec.content.item.item_tool_pick_astral.lore: "A high-grade mining tool forged with azure gemstone. Shortens gathering time at hard veins and raises the chance of finding rare ore and polishing whetstones (Rank 2)."
ec.content.item.item_tool_pick_iron.name: "Starsteel Mining Pickaxe"
ec.content.item.item_tool_pick_iron.lore: "A dedicated pickaxe for gathering ore vein nodes. Right-click a vein to mine starsteel ore and more (Rank 1)."
ec.content.item.item_tool_rod_astral.name: "Starcore Azure Great Rod"
ec.content.item.item_tool_rod_astral.lore: "A supreme fishing rod with an Azure Crystal Core set in its reel shaft. Holds the power to land lords of the abyss and the legendary dragonfish (Rank 3)."
ec.content.item.item_tool_rod_oak.name: "Oak Azure Fishing Rod"
ec.content.item.item_tool_rod_oak.lore: "A beginner RPG fishing rod assembled by Lumina Port's craftsmen. Right-click at the water's edge to start fishing in its own minigame (Rank 1)."
ec.content.item.item_tool_rod_starwood.name: "Starwood Precision Rod"
ec.content.item.item_tool_rod_starwood.lore: "An intermediate rod crafted from supple starwood. Suppresses the tension of thrashing fish and widens the sweet spot (Rank 2)."
ec.content.item.item_tool_rod_willow.name: "Willow Precision Beginner Rod"
ec.content.item.item_tool_rod_willow.lore: "A high-grade early-game rod of supple willow coated with amber sap. Usable from Fishing Lv3, with a slightly wider sweet spot."
ec.content.item.item_tool_sickle_moon.name: "Moondew Herb Sickle"
ec.content.item.item_tool_sickle_moon.lore: "A higher-grade herb sickle with a slender blade holding moonlight. Efficiently picks Frostflower herbs and Moondew spirit herbs (Rank 2)."
ec.content.item.item_tool_sickle_silver.name: "Herbalist's Silver Sickle"
ec.content.item.item_tool_sickle_silver.lore: "A gathering sickle that cuts herbs without damaging their active ingredients. Right-click herb nodes to gather (Rank 1)."
ec.content.item.item_wpn_aether_bastion_mace.name: "Star Fortress Holy War Hammer"
ec.content.item.item_wpn_aether_bastion_mace.lore: "A paladin's heavy hammer holding starshard radiance. [Holy Fortress Wave] Releases a starlight shock with each strike, bolstering defense."
ec.content.item.item_wpn_aether_chronicle_staff.name: "Azure Chronicle Holy Staff \"Aeria\""
ec.content.item.item_wpn_aether_chronicle_staff.lore: "A supreme holy staff reproducing the wavelength of the Aether Core before it shattered. [Aether Resonance] Grants allies blessings along with a starlight resonant burst."
ec.content.item.item_wpn_aether_vanguard_sword.name: "Aether Vanguard Greatsword"
ec.content.item.item_wpn_aether_vanguard_sword.lore: "The emblem of the vanguard, with azure starshard powder kneaded into the steel. [Azure Roar] Gains starlight follow-ups and blessings with heightened rage."
ec.content.item.item_wpn_apprentice_wand.name: "Apprentice Oak Wand"
ec.content.item.item_wpn_apprentice_wand.lore: "A beginner's wand with a small aether stone set in the tip. Built with a safety design that suppresses mana overload."
ec.content.item.item_wpn_ash_longbow.name: "Ashwood Longbow"
ec.content.item.item_wpn_ash_longbow.lore: "A longbow finished from dried young Ashwood. Same model as the Forest Ranger Corps's standard issue."
ec.content.item.item_wpn_ashwood_blade.name: "Ashwood Greatsword"
ec.content.item.item_wpn_ashwood_blade.lore: "A greatsword with a hard ashwood core in the hilt for better shock absorption. Forged to split the hides of forest monsters."
ec.content.item.item_wpn_ashwood_warhammer.name: "Ashwood Guardian Warhammer"
ec.content.item.item_wpn_ashwood_warhammer.lore: "An iron warhammer with an Ashwood starwood shaft. Sturdily built to protect allies on the front line."
ec.content.item.item_wpn_astral_benediction_rod.name: "Azure Blessing Divine Staff \"Celestia\""
ec.content.item.item_wpn_astral_benediction_rod.lore: "A divine staff of blessing resonating with the proving grounds' starcore. [Heavenly Light's Grace] Ceaselessly brings judgments of starlight and abundant healing."
ec.content.item.item_wpn_astral_piercer.name: "Star Piercer Spirit Bow \"Altair\""
ec.content.item.item_wpn_astral_piercer.lore: "A spirit bow crowned with the Aquila constellation. [Meteor Volley] On consecutive crits, starlight homing arrows streak through the air in pairs."
ec.content.item.item_wpn_azure_sovereign_blade.name: "Azure Sovereign Holy Blade \"Glacia\""
ec.content.item.item_wpn_azure_sovereign_blade.lore: "A holy blade bearing the purified azure ice core after defeating the Ice Core Executor. [Absolute Zero Dominance] Cuts enemies with frost star waves and heals the bearer."
ec.content.item.item_wpn_borealis_bow.name: "Aurora Piercer Spirit Bow \"Borealis\""
ec.content.item.item_wpn_borealis_bow.lore: "A legendary spirit bow with the northern aurora spun into its string. [Aurora Ice Star] Azure ice homing arrows pierce the air in response to sharp shots."
ec.content.item.item_wpn_celestial_prayer_staff.name: "Celestial Sphere Prayer Great Staff"
ec.content.item.item_wpn_celestial_prayer_staff.lore: "A holy staff forged for battle from the ritual staff of Stargazer Hill. [Starprayer Resonance] Sends out starlight on attack and circulates mana."
ec.content.item.item_wpn_cryo_eternity_staff.name: "Permafrost Holy Staff \"Eternity\""
ec.content.item.item_wpn_cryo_eternity_staff.lore: "A supreme holy staff crystallizing the cooling wavelength of the \"second Starshard.\" [Azure Ice Sanctuary] Unleashes a frigid starflash while wrapping you in an ice crystal barrier."
ec.content.item.item_wpn_crystal_recurve.name: "Crystal-String Recurve Bow"
ec.content.item.item_wpn_crystal_recurve.lore: "A recurve bow twisted with charged crystal fibers. [Charged Pierce] A critical arrow carries lightning and restores focus."
ec.content.item.item_wpn_eclipse_phantom_blade.name: "Eclipse Night Phantom Blade \"Nocturne\""
ec.content.item.item_wpn_eclipse_phantom_blade.lore: "A jet-black phantom blade carved from the proving grounds' starcore. [Unbroken Shadow Chain] Fires void blades while sharpening your focus."
ec.content.item.item_wpn_frostwind_longbow.name: "Rime Wind Longbow"
ec.content.item.item_wpn_frostwind_longbow.lore: "A longbow laminated from the extreme-cold wood of Rime Ridge. [Frost Wind Piercing Arrow] Follow-up arrows wrapped in freezing currents pierce enemies' weak points."
ec.content.item.item_wpn_glacier_greatsword.name: "Azure Ice Knight's Greatsword"
ec.content.item.item_wpn_glacier_greatsword.lore: "A greatsword forged from azure ice steel from the Azure Frostpeaks. [Freezing Slash] Releases cold with a heavy blow, breaking the enemy's formation."
ec.content.item.item_wpn_hunter_shortbow.name: "Hunter's Shortbow"
ec.content.item.item_wpn_hunter_shortbow.lore: "A light bow carved from supple branches. Light draw, allowing quick shots even while moving."
ec.content.item.item_wpn_iron_dirk.name: "Shadow-Stitch Iron Dirk"
ec.content.item.item_wpn_iron_dirk.lore: "A lightweight iron dirk carried by Shadowblade apprentices. Strikes weak points with quick riposte."
ec.content.item.item_wpn_lumina_staff.name: "Lumina Water Mirror Staff"
ec.content.item.item_wpn_lumina_staff.lore: "A staff crowned with clear spring crystal from Lumina Port. Smoothly guides ice and aether incantations."
ec.content.item.item_wpn_minebreaker_greatsword.name: "Rockbreaker Mining Greatsword"
ec.content.item.item_wpn_minebreaker_greatsword.lore: "A greatsword repurposed from heavy mining alloy that shatters even obsidian bedrock. [Rockbreaking Strike] Has a chance on attack to deal extra impact and break the enemy's guard."
ec.content.item.item_wpn_mineguard_halberd.name: "Mine Guardian's Halberd"
ec.content.item.item_wpn_mineguard_halberd.lore: "A heavy halberd forged by the mine guard to withstand monster charges."
ec.content.item.item_wpn_novice_censer.name: "Star Prayer Censer Staff"
ec.content.item.item_wpn_novice_censer.lore: "A wooden censer staff for Star Guide apprentices to learn prayer and the guidance of light."
ec.content.item.item_wpn_obsidian_stiletto.name: "Obsidian Shadow-Piercing Rapier"
ec.content.item.item_wpn_obsidian_stiletto.lore: "An assassin's rapier forged from obsidian deep in the mine. Pierces gaps in heavy armor in a single breath."
ec.content.item.item_wpn_prism_scepter.name: "Prismatic Holy Light Scepter"
ec.content.item.item_wpn_prism_scepter.lore: "A holy scepter set with polished thunder crystals from the mine. Channels starlight and thunder at once."
ec.content.item.item_wpn_quartz_scepter.name: "Thunder Crystal Magic Scepter"
ec.content.item.item_wpn_quartz_scepter.lore: "A scepter carved from high-purity charged crystal mined in the Weeping Mine. [Chain Discharge] Elemental attacks call down thunder."
ec.content.item.item_wpn_recruit_mace.name: "Oath Apprentice Warhammer"
ec.content.item.item_wpn_recruit_mace.lore: "A rough stone hammer granted to paladin apprentices. Plain, but excellent in stability of blocking and striking."
ec.content.item.item_wpn_rime_scepter.name: "Ice Crystal Resonance Staff"
ec.content.item.item_wpn_rime_scepter.lore: "A magic staff crowned with a resonant icicle cut from the Azure Crystal Cavern. [Ice Ring Recirculation] Converts cold into mana and fires a follow-up ice flash."
ec.content.item.item_wpn_rusty_broadsword.name: "Iron Training Sword"
ec.content.item.item_wpn_rusty_broadsword.lore: "A rugged straight sword the Lumina Port guild lends to newcomers. Chipped often, but its balance is honest and easy to handle."
ec.content.item.item_wpn_sovereign_aegis_hammer.name: "Azure Holy Shield Sovereign Hammer \"Aegis\""
ec.content.item.item_wpn_sovereign_aegis_hammer.lore: "A legendary warhammer permitted to paladins who overcame the Starshard Trial. [Immortal Holy Light] Each strike's starlight wave shatters enemies and heals the bearer."
ec.content.item.item_wpn_starblossom_crozier.name: "Starblossom Guiding Crozier"
ec.content.item.item_wpn_starblossom_crozier.lore: "An iron crozier modeled on the Stardew Lotus. Smoothly amplifies healing and starlight mana."
ec.content.item.item_wpn_stargazer_rod.name: "Celestial Sphere Star Staff"
ec.content.item.item_wpn_stargazer_rod.lore: "A miniature armillary sphere designed by Sage Lyra quietly rotates on the staff head. [Stellar Circulation] The stars' orbits recirculate mana."
ec.content.item.item_wpn_starlight_bow.name: "Starlight Sniper Bow"
ec.content.item.item_wpn_starlight_bow.lore: "An elegant bow fitted with the Stargazer Hill's aiming scope. [Long-Range Aim] Shoots weak points from afar with starlight follow-ups."
ec.content.item.item_wpn_thorn_twinblade.name: "Thorn Fang Twin Blades"
ec.content.item.item_wpn_thorn_twinblade.lore: "Twin short blades with Ashwood Thorn Wolf fangs set into the edges. Razor sharp on a crit."
ec.content.item.item_wpn_void_cleaver.name: "Void Cleaver Holy Blade \"Eclipse\""
ec.content.item.item_wpn_void_cleaver.lore: "A holy blade recast as proof of defeating the Void Guardian. [Eclipse Judgment] When starlight marks fill, unleashes an aether shockwave and heals itself."
ec.content.item.item_wpn_void_fang_dagger.name: "Void Shadow Fang Assassin Blades"
ec.content.item.item_wpn_void_fang_dagger.lore: "Black twin blades modeled on a rift in the void. [Void Shadow Pursuit] The afterimage of each slash delays and carves in void damage."
