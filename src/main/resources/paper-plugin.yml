name: EtherealChronicle
version: '${version}'
main: net.nakaymi.etherealchronicle.paper.RpgPlugin
api-version: '26.3'
bootstrapper: net.nakaymi.etherealchronicle.paper.EtherealBootstrap
description: Original fantasy MMORPG for PaperMC
website: https://nakaymi.net
authors:
  - nakaymi
dependencies:
  server:
    BetterModel:
      load: BEFORE
      required: false
permissions:
  etherealchronicle.admin:
    description: エーテルの年代記 管理者権限
    default: op
  etherealchronicle.pack.bypass:
    description: 必須リソースパックを拒否しても接続できる運用・QA用権限
    default: op
